# cargo-fuzz targets for the codec (fuzz.yml runs them nightly).
[package]
name = "pyhoglake-variant-codec-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arrow-array = "59.3"
arrow-schema = "59.3"
chrono = "0.4.45"
libfuzzer-sys = "0.4.13"
parquet-variant = "59.3"
pyhoglake-variant-codec = { path = ".." }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "unbounded_depth"] }

[[bin]]
name = "encode_json"
path = "fuzz_targets/encode_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[workspace]
