[package]
name = "pyhoglake-variant-codec"
# Not a version to bump: the wheel's is pyproject.toml's.
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "pyhoglake_variant_codec"
crate-type = ["cdylib", "rlib"]

[features]
# The binding, which maturin builds; `cargo test` needs no Python.
python = ["dep:pyo3", "dep:pyo3-arrow"]

[dependencies]
# arrow 59.x, the line pyo3-arrow 0.20 takes.
arrow-array = "59.3"
arrow-buffer = "59.3"
arrow-data = "59.3"
arrow-schema = "59.3"
pyo3 = { version = "0.30.1", features = ["abi3-py312"], optional = true }
pyo3-arrow = { version = "0.20.0", optional = true }

[dev-dependencies]
# An independent decoder to read the output, and the JSON to compare it to.
parquet-variant = "59.3"
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "unbounded_depth"] }

[profile.release]
lto = true
codegen-units = 1
