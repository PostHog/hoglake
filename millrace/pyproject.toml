[project]
name = "millrace"
version = "0.1.0.dev0"
description = "Kafka -> hoglake ingestion daemon with SlateDB staging; per-key flush readiness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyhoglake",
    # >=25.0, NOT pyhoglake's 21: flush.py's _sort_batch_by_spec calls
    # pc.sort_indices with (name, direction, null_placement) triples,
    # which pyarrow only accepts from 25.0.0 — on 21–24 the compute
    # layer unpacks two-tuples and raises "too many values to unpack"
    # for every sorted flush (verified by bisecting 21.0.0–25.0.0 in
    # scratch venvs; the failure mode is every sorted flush refusing).
    "pyarrow>=25.0",
    # Pinned to the 0.17.x line: the binding-parity suite
    # (tests/test_slatedb_parity.py) pins THIS version's observed
    # semantics — lazy FENCED on a contested open, GC-beside-a-writer
    # safety, "compactor disabled stalls L0 at l0_max_ssts",
    # submit_compaction's enqueue-only shape, the emitted metric names.
    # A minor bump is a deliberate re-verification, not a refresh.
    "slatedb==0.17.*",
    "confluent-kafka>=2.16.0",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.scripts]
millrace = "millrace.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "hypothesis>=6.100",
    # Pinned like pyhoglake's, so the type check is the same on every machine.
    "mypy==2.3.1",
    # The CI-gate meta-test parses the workflow file (tests/test_ci_gate.py).
    "pyyaml>=6.0",
    # Pinned: see pyhoglake's note — an unpinned ruff resolves a
    # different rule set per machine.
    "ruff==0.16.7",
    # Pinned for the same reason: mutant generation changes between
    # releases. Scoped to the pure core (keyspace, planner); run on
    # changes to those files (docs/kafka-ingestion-plan.md, Phase 1).
    "mutmut==3.8.0",
]

[tool.uv.sources]
pyhoglake = { path = "../pyhoglake", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["millrace"]

[tool.hatch.build.targets.sdist]
# Keeps the flox env, justfile, and uv.lock out of the sdist. Hatchling
# adds pyproject.toml, README.md, and LICENSE on its own.
only-include = ["millrace", "tests"]

[tool.ruff]
# mutmut's working tree (generated by `mutmut run`; gitignored).
extend-exclude = ["mutants"]

[tool.mypy]
files = ["millrace"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# pyarrow, slatedb and confluent-kafka ship no type information.
module = ["pyarrow", "pyarrow.*", "slatedb", "slatedb.*", "confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: real SlateDB persistence on file:/// (durability across restart, contested-open fencing); no docker needed",
    "live: the live docker stack (hoglake server built from the checkout + Postgres + MinIO + apache/kafka; ci/live-millrace.sh); deselected unless -m mentions 'live' (see tests/conftest.py)",
    "component: SlateDB on memory:/// — staging behavior and binding-parity probes without docker",
    "bench: non-gating SlateDB rate benches (validation item 2); deselected unless --bench is passed (see README)",
    "replay: the seeded Zipf-skew planner replay (test_planner_replay.py); excluded from mutmut runs",
]
testpaths = ["tests"]

[tool.mutmut]
# Mutation-test the pure core (docs/kafka-ingestion-plan.md, Phase 1).
source_paths = ["millrace/keyspace.py", "millrace/planner.py"]
# The replay test is the one slow suite and pins distributions, not
# predicates; every load-bearing predicate is covered by the two fast
# files. pytest picks up tests/conftest.py: deterministic hypothesis
# (derandomize), no deadline.
pytest_add_cli_args_test_selection = ["tests/test_keyspace.py", "tests/test_planner.py"]
pytest_add_cli_args = ["-x", "-q"]
# The rest of the package, copied VERBATIM (never mutated) so the mutants/
# tree is importable: setup_source_paths puts mutants/ first on sys.path,
# and with only the two mutated files present, conftest's
# ``from millrace.stage import ...`` (via stagekit) failed collection with
# ModuleNotFoundError — mutmut run has been broken since Phase 2 added
# stage imports to conftest. Copying the whole directory (not a file list)
# keeps a future module from silently reintroducing that failure.
also_copy = ["millrace/"]
# Per-mutant CPU budget is (estimated_test_time + timeout_constant) ×
# timeout_multiplier × 2. CI runners are ~6.5× slower than a dev machine
# (15.9 vs ~104 mutants/s, PR #331's first run), and a timeout verdict
# fails the survivors gate as a broken run — the multiplier carries the
# CI/local speed gap with 4× headroom on top.
timeout_multiplier = 60.0
