version: 2
updates:
  # Keeps the SHA-pinned actions in every workflow on one version set.
  # One grouped PR a week; the cooldown skips releases younger than 7 days.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
