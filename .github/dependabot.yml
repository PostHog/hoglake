# Version updates, not just security alerts. The original dependency
# set was written from an agent's memory rather than a registry lookup
# and arrived up to 17 months stale at the initial commit (parquet
# 1.15.2, Apr 2025, at a Sep 2026 bootstrap); security scanning never
# noticed because staleness without a CVE is invisible to it. These
# schedules make staleness produce PRs instead of silence.
#
# Minor and patch updates arrive grouped per ecosystem (one PR a week,
# low noise); majors stay individual so breaking changes are reviewed
# on their own. The 7-day cooldown skips freshly published versions so
# a malicious or broken release ages out before a PR carries it in —
# the same reasoning as millpond's uv exclude-newer window.
version: 2
updates:
  - package-ecosystem: gradle
    directories:
      - /server
      - /server/trino
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Ktor 3.6.0's test engine deadlocks a testApplication response
      # over 1 MiB (KTOR-9968, ktorio/ktor#5918): the writer became a
      # child of the per-request job the engine awaits before the client
      # may read. ScanColumnStatsCapApiTest serves a million column-stat
      # entries and hung the whole suite (#298). The fix is unreleased;
      # this pins out 3.6.0 ONLY, so 3.6.1 arrives on its own.
      - dependency-name: "io.ktor:*"
        versions: ["3.6.0"]

  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directories:
      - /pyhoglake
      - /hedgerow
      - /bench
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
