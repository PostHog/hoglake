name: Server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # EVERY PR AND MAIN PUSH RUNS THIS WORKFLOW; the path filter lives in
  # this job, not on the trigger. The main ruleset requires `server-test`
  # on every PR, and a required check has to be PRODUCED on every PR: a
  # workflow that path-filters itself out leaves the check "expected"
  # forever and the PR cannot merge (#301 moved the migration gate out
  # of this file for exactly that; a Python-only PR was left with no
  # `test` at all). A job skipped by `if:` reports `skipped`, which the
  # ruleset accepts. So this job decides, in seconds, and the heavy
  # jobs condition on its answer.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            server:
              - "server/**"
              # The Kotlin↔Python parity gates read the shared vector
              # files from the Python tree (QeBoundsVectorsTest,
              # VariantShreddingVectorFileTest, VariantLayoutTest) — a
              # vectors-only PR must run the server suite too.
              - "pyhoglake/tests/vectors/**"
              - ".github/workflows/server.yml"
              - ".github/workflows/python-live.yml"
              - "ci/**"

  python-live:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/python-live.yml

  # Deployment requires both suites. Run this gate only for server
  # changes. THIS is the check the ruleset requires, not `server-test`:
  # requiring the leaf let #304 merge with python-live red (two hours
  # of red main until #306). A required gate is what makes a gate.
  # Runs (and fails) when `changes` itself failed: a skipped gate
  # passes the ruleset, so a broken filter must not read as "nothing
  # to check".
  server-checks:
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true')
    needs: [changes, server-test, python-live]
    runs-on: ubuntu-latest
    steps:
      - name: Require both suites
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SERVER_RESULT: ${{ needs.server-test.result }}
          LIVE_RESULT: ${{ needs.python-live.result }}
        run: |
          test "$CHANGES_RESULT" = success &&
            test "$SERVER_RESULT" = success &&
            test "$LIVE_RESULT" = success

  server-test:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The hoglite engine the live suites run against: hoglited taken
    # from hoglite's release image in ECR (repository "hoglite"),
    # pinned by IMAGE DIGEST, never by tag. Change both in one reviewed
    # commit:
    #   HOGLITE_COMMIT         hoglite commit the image was built from;
    #                          checked against the image's
    #                          org.opencontainers.image.revision label
    #   HOGLITED_IMAGE_DIGEST  digest of that image (release tag
    #                          r202610310801-bfdf4b)
    # The digest is content-addressed, so it fixes every byte of the
    # engine; there is deliberately no separate binary hash (see
    # ci/fetch-hoglited.sh). Reproduce with pull access to the hoglite
    # ECR repository:
    #   docker pull --platform linux/amd64 <registry>/hoglite@<HOGLITED_IMAGE_DIGEST>
    #   id=$(docker create --platform linux/amd64 <registry>/hoglite@<HOGLITED_IMAGE_DIGEST>)
    #   docker cp "$id:/usr/local/bin/hoglited" hoglited && docker rm "$id"
    # ci/fetch-hoglited.sh runs exactly that, checks the revision label,
    # and puts the release's Go toolchain (go version -m) in the job
    # summary, which is what a rebuild from source at HOGLITE_COMMIT needs.
    env:
      HOGLITE_COMMIT: bfdf4b3c39b1cf3a4f7b38ebc847c7d50b1ca25c
      HOGLITED_IMAGE_DIGEST: sha256:924dafe1413c0a20d1005ae281b7dd094eb59d27d948b373ef5cea86e6fce4ab
    # id-token: the OIDC token for the ECR pull role (main pushes only;
    # the role's trust admits refs/heads/main and nothing else).
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: server-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # Docker required (Testcontainers: postgres:18 + pgsty/silo, the
      # MinIO build — both unauthenticated Docker Hub pulls, the usual
      # rate-limit flake source). :test includes the schema-equivalence gate
      # (fold(migrations) == schema.sql).

      # ---- Live hoglite engine -------------------------------------
      # The Hoglite*IntegrationTest classes start a real hoglited from
      # HOGLITE_BINARY and skip without one.
      #
      # PUSH TO MAIN = ENFORCE. The job assumes hoglake's existing ECR
      # role over GitHub OIDC (role ARN in the
      # HOGLAKE_AWS_ECR_PUBLISH_IAM_ROLE secret, the one ecr-release.yml
      # uses), pulls the pinned image by digest, checks its revision
      # label, and then requires every hoglite test class to run with
      # zero skips. A missing secret, a failed role assumption or pull,
      # a wrong revision label, or any hoglite skip fails the job.
      #
      # PULL REQUEST = SKIP, BY DESIGN. The role trusts
      # refs/heads/main only, so a PR run cannot pull the engine. It
      # runs everything else, skips the live-engine suites, and says so
      # in a notice and one job-summary line with the counts. The job
      # stays green; main enforces.
      - name: Decide whether the live hoglite suites run
        id: hoglite
        env:
          ENFORCE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          HAS_ROLE: ${{ secrets.HOGLAKE_AWS_ECR_PUBLISH_IAM_ROLE != '' }}
        run: |
          if [[ $ENFORCE != true ]]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live hoglite suites run on main::This run skips the live-engine hoglite suites; they run, with a zero-skip gate, on every push to main."
          elif [[ $HAS_ROLE == true ]]; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=hoglite engine unavailable::The HOGLAKE_AWS_ECR_PUBLISH_IAM_ROLE secret is not set, so hoglite image ${HOGLITED_IMAGE_DIGEST} cannot be pulled and the live hoglite suites would skip."
            exit 1
          fi

      - name: Assume the ECR pull role
        id: aws
        if: steps.hoglite.outputs.mode == 'live'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.HOGLAKE_AWS_ECR_PUBLISH_IAM_ROLE }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Log in to ECR
        id: ecr
        if: steps.hoglite.outputs.mode == 'live'
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Explain a failed ECR login
        if: failure() && (steps.aws.outcome == 'failure' || steps.ecr.outcome == 'failure')
        run: |
          echo "::error title=hoglite engine unavailable::Could not assume the ECR pull role or log in, so hoglite image ${HOGLITED_IMAGE_DIGEST} (expected hoglite ${HOGLITE_COMMIT}) cannot be pulled. The role must be trusted for this repository's main branch and allowed to pull the hoglite repository."
          exit 1

      # The registry host names the AWS account; mask it in this public
      # repository's logs.
      - name: Pull hoglited from the pinned image and verify it
        if: steps.hoglite.outputs.mode == 'live'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "::add-mask::${REGISTRY}"
          ci/fetch-hoglited.sh "$REGISTRY" "$HOGLITED_IMAGE_DIGEST" "$HOGLITE_COMMIT" "$RUNNER_TEMP/hoglited" \
            > "$RUNNER_TEMP/hoglite-engine.txt"
          cat "$RUNNER_TEMP/hoglite-engine.txt"
          { echo "### hoglite engine"; echo '```'; cat "$RUNNER_TEMP/hoglite-engine.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "HOGLITE_BINARY=$RUNNER_TEMP/hoglited" >> "$GITHUB_ENV"

      - name: Server tests + ktlint
        working-directory: server
        run: ./gradlew --no-daemon :test :ktlintCheck :checkOpenapiVersion

      # The hoglite tests skip (assumeTrue) without an engine, and a
      # skip passes Gradle. On main this step reads the JUnit reports so
      # a skip (or a missing report) fails the job, and puts the counts
      # in the job summary. On a PR it only writes the one-line note. It
      # also runs after a test failure, so the summary always has them.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: ${{ !cancelled() && steps.hoglite.outputs.mode != '' }}
      - name: Require the hoglite suites to run with zero skips
        if: ${{ !cancelled() && steps.hoglite.outputs.mode != '' }}
        env:
          MODE: ${{ steps.hoglite.outputs.mode }}
        run: |
          # Every report in the hoglite package or of a Hoglite* class
          # anywhere, and the live-engine classes by name, so a class
          # that never ran fails too. A class that needs the engine but
          # has another name must be added to `required`.
          dir=server/build/test-results/test
          required=(HogliteBackendIntegrationTest HogliteGuardRaceTest HogliteObjectPrefixIntegrationTest HogliteBackendConformanceIntegrationTest HogliteSchemaEquivalenceIntegrationTest HogliteDurabilityConformanceIntegrationTest)
          reports=()
          for cls in "${required[@]}"; do
            reports+=("$dir/TEST-com.posthog.hoglake.hoglite.${cls}.xml")
          done
          shopt -s nullglob
          for f in "$dir"/TEST-com.posthog.hoglake.hoglite.*.xml "$dir"/TEST-*.Hoglite*.xml; do
            [[ " ${reports[*]} " == *" $f "* ]] || reports+=("$f")
          done
          status=0
          uv run --no-project --with defusedxml==0.7.1 python ci/check_live_results.py \
            "${reports[@]}" > "$RUNNER_TEMP/hoglite-counts.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/hoglite-counts.txt"
          tests=$(grep -o '[0-9]* tests;' "$RUNNER_TEMP/hoglite-counts.txt" | awk '{n+=$1} END {print n+0}')
          skipped=$(grep -o "'skipped': [0-9]*" "$RUNNER_TEMP/hoglite-counts.txt" | awk '{n+=$2} END {print n+0}')
          if [[ $MODE == skip ]]; then
            note="Live hoglite suites run on pushes to main; this run skipped them by design (${tests} hoglite tests, ${skipped} skipped)."
            echo "$note"
            echo "$note" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          line="${tests} hoglite tests, ${skipped} skipped (engine ${HOGLITE_COMMIT:0:12}, image ${HOGLITED_IMAGE_DIGEST:7:12})"
          if [[ $status == 0 ]]; then
            title="Live hoglite suites: ${line}"
          else
            title="Live hoglite suites FAILED the zero-skip gate: ${line}"
            echo "::error title=hoglite suites incomplete::${line}. Every hoglite test class must run with zero skips, failures and errors."
          fi
          echo "$title"
          { echo "## ${title}"; echo '```'; cat "$RUNNER_TEMP/hoglite-counts.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  trino-test:
    # The connector lives in PostHog/trino (repo PR #1); this runs the
    # in-repo integration harness against the fork's PUBLIC server
    # image (ghcr.io/posthog/trino, mirrored by its publish workflow on
    # every master push). The image is arm64-only, hence the ARM
    # runner. Deliberately NOT in deploy's `needs` and not a required
    # check: a broken fork build or a flaky ~1GB pull must never wedge
    # hoglake CD (that failure mode killed the original job).
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    concurrency:
      group: server-trino-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # Image selection: the HOGLAKE_TRINO_IMAGE repo variable pins an
      # exact ref when set; otherwise resolve the newest ordered
      # release tag (r<position>-<sha6>, lexicographically sortable by
      # construction) from the public ghcr mirror — anonymous, no
      # cross-repo auth, and new fork releases are picked up with zero
      # changes here.
      - name: Resolve Trino image
        id: image
        env:
          PINNED: ${{ vars.HOGLAKE_TRINO_IMAGE }}
        run: |
          if [ -n "$PINNED" ]; then
            echo "ref=$PINNED" >> "$GITHUB_OUTPUT"
            echo "Using pinned image: $PINNED"
            exit 0
          fi
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:posthog/trino:pull" | jq -r .token)
          tag=$(curl -fsS -H "Authorization: Bearer $token" \
            "https://ghcr.io/v2/posthog/trino/tags/list?n=1000" \
            | jq -r '.tags[]' | grep -E '^r[0-9]{12}-[0-9a-f]{6}$' | sort | tail -1)
          [ -n "$tag" ] || { echo "::error::No ordered release tag found on ghcr.io/posthog/trino"; exit 1; }
          echo "ref=ghcr.io/posthog/trino:$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved latest fork release: $tag"

      - name: Trino connector integration tests
        working-directory: server
        env:
          HOGLAKE_TRINO_IMAGE: ${{ steps.image.outputs.ref }}
        run: ./gradlew --no-daemon :trino:test

  image:
    # The deployable image must assemble and BOOT from every PR —
    # build-only checks miss runtime breakage (read-only-rootfs and
    # boot-order findings both got past a build-only gate in review).
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Same major the Testcontainers suite and the dev compose stack
        # run, so the smoke boot is not the one place a version differs.
        # Digest is the multi-arch MANIFEST (index) digest, never a
        # per-arch one — `docker buildx imagetools inspect postgres:18`.
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: hoglake
          POSTGRES_USER: hoglake
          POSTGRES_PASSWORD: hoglake
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hoglake" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # cache-from only: PRs read main's CD cache (scope=server), never
      # write it — no poisoning surface.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          load: true
          tags: hoglake-server:ci
          cache-from: type=gha,scope=server

      - name: Smoke - boots and answers /healthz against a real DB
        run: |
          docker run -d --name smoke --network host \
            -e HOGLAKE_JDBC_URL="jdbc:postgresql://localhost:5432/hoglake" \
            hoglake-server:ci
          for _ in $(seq 1 30); do
            if curl -fsS -m 2 http://localhost:8080/healthz; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke | tail -20
          [ "${ok:-}" = "1" ]

  deploy:
    # Server deployment requires the server suite and both live client suites.
    # Unrelated changes skip server-checks and this job.
    needs: [server-checks]
    # Forks must not push images or deployment dispatches.
    if: github.event_name == 'push' && github.repository == 'PostHog/hoglake'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: server-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build identity GET /v1/info reports, so the webui names which
      # build is live within a version that stays constant between
      # releases. UTC, minute resolution, sortable as a plain string.
      # Only this job stamps: an unstamped build is by definition not a
      # deployed one.
      - name: Build stamp
        id: stamp
        run: echo "value=$(date -u +%Y%m%dT%H%MZ)" >> "$GITHUB_OUTPUT"

      # Multi-arch: the mw fleet runs Graviton nodes. The Dockerfile's
      # build stage is pinned to $BUILDPLATFORM, so gradle runs once
      # natively; only the JRE runtime layer is per-arch.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            HOGLAKE_BUILD_STAMP=${{ steps.stamp.outputs.value }}
          tags: |
            ghcr.io/posthog/hoglake-server:${{ github.sha }}
            ghcr.io/posthog/hoglake-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      # The promotable ref is the multi-arch MANIFEST digest — never a
      # per-arch digest (see millpond/duckgres AGENT docs).
      - name: Get image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect --raw ghcr.io/posthog/hoglake-server:${{ github.sha }} | sha256sum | awk '{print "sha256:"$1}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Get deployer token
        id: deployer
        uses: getsentry/action-github-app-token@5c1e90706fe007857338ac1bfbd7a4177db2f789 # v4.0.0
        with:
          app_id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
          private_key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}

      # The dispatch payload must stay under repository_dispatch's
      # ~64KB client_payload limit, and a squash-merge commit message
      # is the PR title PLUS its whole body — #69's was 74KB and the
      # dispatch was rejected, failing deploy. Ship a trimmed commit:
      # first message line (capped), identity fields only. The message
      # reaches the run's env, never template-interpolation into run:.
      - name: Trim dispatch commit
        id: dispatch_commit
        env:
          HEAD_COMMIT: ${{ toJson(github.event.head_commit) }}
        run: |
          trimmed=$(printf '%s' "$HEAD_COMMIT" | jq -c \
            '{id, timestamp, author, committer, message: (.message | split("\n")[0] | .[0:200])}')
          printf 'json=%s\n' "$trimmed" >> "$GITHUB_OUTPUT"

      # Deploy target: gigahog-server (state/gigahog-server.yaml in
      # PostHog/charts). Dev auto-promotes; prod waits on the
      # prod-promote-managed-warehouse approval gate.
      - name: Trigger deployment via Charts repo
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.deployer.outputs.token }}
          repository: PostHog/charts
          event-type: commit_state_update
          client-payload: |
            {
              "values": {
                "image": {
                  "sha": "${{ github.sha }}@${{ steps.digest.outputs.digest }}"
                }
              },
              "release": "gigahog-server",
              "commit": ${{ steps.dispatch_commit.outputs.json }},
              "repository": ${{ toJson(github.repository) }},
              "labels": [],
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }
