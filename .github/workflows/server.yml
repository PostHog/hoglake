name: Server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # EVERY PR AND MAIN PUSH RUNS THIS WORKFLOW; the path filter lives in
  # this job, not on the trigger. The main ruleset requires `server-test`
  # on every PR, and a required check has to be PRODUCED on every PR: a
  # workflow that path-filters itself out leaves the check "expected"
  # forever and the PR cannot merge (#301 moved the migration gate out
  # of this file for exactly that; a Python-only PR was left with no
  # `test` at all). A job skipped by `if:` reports `skipped`, which the
  # ruleset accepts. So this job decides, in seconds, and the heavy
  # jobs condition on its answer.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            server:
              - "server/**"
              # The Kotlin↔Python parity gates read the shared vector
              # files from the Python tree (QeBoundsVectorsTest,
              # VariantShreddingVectorFileTest,
              # SchemaAnnotationVectorFileTest) — a vectors-only PR must
              # run the server suite too.
              - "pyhoglake/tests/vectors/**"
              - ".github/workflows/server.yml"
              - ".github/workflows/python-live.yml"
              - "ci/**"

  python-live:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/python-live.yml

  # Deployment requires both suites. Run this gate only for server
  # changes. THIS is the check the ruleset requires, not `server-test`:
  # requiring the leaf let #304 merge with python-live red (two hours
  # of red main until #306). A required gate is what makes a gate.
  # Runs (and fails) when `changes` itself failed: a skipped gate
  # passes the ruleset, so a broken filter must not read as "nothing
  # to check".
  server-checks:
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true')
    needs: [changes, server-test, python-live]
    runs-on: ubuntu-latest
    steps:
      - name: Require both suites
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SERVER_RESULT: ${{ needs.server-test.result }}
          LIVE_RESULT: ${{ needs.python-live.result }}
        run: |
          test "$CHANGES_RESULT" = success &&
            test "$SERVER_RESULT" = success &&
            test "$LIVE_RESULT" = success

  server-test:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: server-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # Docker required (Testcontainers: postgres:18 + pgsty/silo, the
      # MinIO build — both unauthenticated Docker Hub pulls, the usual
      # rate-limit flake source). :test includes the schema-equivalence gate
      # (fold(migrations) == schema.sql).
      - name: Server tests + ktlint
        working-directory: server
        run: ./gradlew --no-daemon :test :ktlintCheck :checkOpenapiVersion

  trino-test:
    # The connector lives in PostHog/trino (repo PR #1); this runs the
    # in-repo integration harness against the fork's PUBLIC server
    # image (ghcr.io/posthog/trino, mirrored by its publish workflow on
    # every master push). The image is arm64-only, hence the ARM
    # runner. Deliberately NOT in deploy's `needs` and not a required
    # check: a broken fork build or a flaky ~1GB pull must never wedge
    # hoglake CD (that failure mode killed the original job).
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    concurrency:
      group: server-trino-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # Image selection: the HOGLAKE_TRINO_IMAGE repo variable pins an
      # exact ref when set; otherwise resolve the newest ordered
      # release tag (r<position>-<sha6>, lexicographically sortable by
      # construction) from the public ghcr mirror — anonymous, no
      # cross-repo auth, and new fork releases are picked up with zero
      # changes here.
      - name: Resolve Trino image
        id: image
        env:
          PINNED: ${{ vars.HOGLAKE_TRINO_IMAGE }}
        run: |
          if [ -n "$PINNED" ]; then
            echo "ref=$PINNED" >> "$GITHUB_OUTPUT"
            echo "Using pinned image: $PINNED"
            exit 0
          fi
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:posthog/trino:pull" | jq -r .token)
          tag=$(curl -fsS -H "Authorization: Bearer $token" \
            "https://ghcr.io/v2/posthog/trino/tags/list?n=1000" \
            | jq -r '.tags[]' | grep -E '^r[0-9]{12}-[0-9a-f]{6}$' | sort | tail -1)
          [ -n "$tag" ] || { echo "::error::No ordered release tag found on ghcr.io/posthog/trino"; exit 1; }
          echo "ref=ghcr.io/posthog/trino:$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved latest fork release: $tag"

      - name: Trino connector integration tests
        working-directory: server
        env:
          HOGLAKE_TRINO_IMAGE: ${{ steps.image.outputs.ref }}
        run: ./gradlew --no-daemon :trino:test

  image:
    # The deployable image must assemble and BOOT from every PR —
    # build-only checks miss runtime breakage (read-only-rootfs and
    # boot-order findings both got past a build-only gate in review).
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Same major the Testcontainers suite and the dev compose stack
        # run, so the smoke boot is not the one place a version differs.
        # Digest is the multi-arch MANIFEST (index) digest, never a
        # per-arch one — `docker buildx imagetools inspect postgres:18`.
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: hoglake
          POSTGRES_USER: hoglake
          POSTGRES_PASSWORD: hoglake
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hoglake" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # cache-from only: PRs read main's CD cache (scope=server), never
      # write it — no poisoning surface.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          load: true
          tags: hoglake-server:ci
          cache-from: type=gha,scope=server

      - name: Smoke - boots and answers /healthz against a real DB
        run: |
          docker run -d --name smoke --network host \
            -e HOGLAKE_JDBC_URL="jdbc:postgresql://localhost:5432/hoglake" \
            hoglake-server:ci
          for _ in $(seq 1 30); do
            if curl -fsS -m 2 http://localhost:8080/healthz; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke | tail -20
          [ "${ok:-}" = "1" ]

  deploy:
    # Server deployment requires the server suite and both live client suites.
    # Unrelated changes skip server-checks and this job.
    needs: [server-checks]
    # Forks must not push images or deployment dispatches.
    if: github.event_name == 'push' && github.repository == 'PostHog/hoglake'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: server-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build identity GET /v1/info reports, so the webui names which
      # build is live within a version that stays constant between
      # releases. UTC, minute resolution, sortable as a plain string.
      # Only this job stamps: an unstamped build is by definition not a
      # deployed one.
      - name: Build stamp
        id: stamp
        run: echo "value=$(date -u +%Y%m%dT%H%MZ)" >> "$GITHUB_OUTPUT"

      # Multi-arch: the mw fleet runs Graviton nodes. The Dockerfile's
      # build stage is pinned to $BUILDPLATFORM, so gradle runs once
      # natively; only the JRE runtime layer is per-arch.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            HOGLAKE_BUILD_STAMP=${{ steps.stamp.outputs.value }}
          tags: |
            ghcr.io/posthog/hoglake-server:${{ github.sha }}
            ghcr.io/posthog/hoglake-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      # The promotable ref is the multi-arch MANIFEST digest — never a
      # per-arch digest (see millpond/duckgres AGENT docs).
      - name: Get image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect --raw ghcr.io/posthog/hoglake-server:${{ github.sha }} | sha256sum | awk '{print "sha256:"$1}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Get deployer token
        id: deployer
        uses: getsentry/action-github-app-token@5c1e90706fe007857338ac1bfbd7a4177db2f789 # v4.0.0
        with:
          app_id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
          private_key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}

      # The dispatch payload must stay under repository_dispatch's
      # ~64KB client_payload limit, and a squash-merge commit message
      # is the PR title PLUS its whole body — #69's was 74KB and the
      # dispatch was rejected, failing deploy. Ship a trimmed commit:
      # first message line (capped), identity fields only. The message
      # reaches the run's env, never template-interpolation into run:.
      - name: Trim dispatch commit
        id: dispatch_commit
        env:
          HEAD_COMMIT: ${{ toJson(github.event.head_commit) }}
        run: |
          trimmed=$(printf '%s' "$HEAD_COMMIT" | jq -c \
            '{id, timestamp, author, committer, message: (.message | split("\n")[0] | .[0:200])}')
          printf 'json=%s\n' "$trimmed" >> "$GITHUB_OUTPUT"

      # Deploy target: gigahog-server (state/gigahog-server.yaml in
      # PostHog/charts). Dev auto-promotes; prod waits on the
      # prod-promote-managed-warehouse approval gate.
      - name: Trigger deployment via Charts repo
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.deployer.outputs.token }}
          repository: PostHog/charts
          event-type: commit_state_update
          client-payload: |
            {
              "values": {
                "image": {
                  "sha": "${{ github.sha }}@${{ steps.digest.outputs.digest }}"
                }
              },
              "release": "gigahog-server",
              "commit": ${{ steps.dispatch_commit.outputs.json }},
              "repository": ${{ toJson(github.repository) }},
              "labels": [],
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }
