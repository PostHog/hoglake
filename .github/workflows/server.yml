name: Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      # The Kotlin↔Python codec bit-compatibility gate reads the shared
      # vector file from the Python tree (QeBoundsVectorsTest) — a
      # vectors-only PR must run the server suite too.
      - "pyhoglake/tests/vectors/**"
      - ".github/workflows/server.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "pyhoglake/tests/vectors/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: server-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Docker required (Testcontainers: postgres:16 + minio — both
      # unauthenticated Docker Hub pulls, the usual rate-limit flake
      # source). :test includes the schema-equivalence gate
      # (fold(migrations) == schema.sql).
      - name: Server tests + ktlint
        working-directory: server
        run: ./gradlew --no-daemon :test :ktlintCheck :checkOpenapiVersion

  trino-test:
    # Parallel to `test`: boots the hoglake server in-process plus the
    # ~1GB trinodb/trino:446 container — the slowest, flakiest pull.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: server-trino-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Trino connector tests
        working-directory: server
        run: ./gradlew --no-daemon :trino:test

  image:
    # The deployable image must assemble and BOOT from every PR —
    # build-only checks miss runtime breakage (read-only-rootfs and
    # boot-order findings both got past a build-only gate in review).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: hoglake
          POSTGRES_USER: hoglake
          POSTGRES_PASSWORD: hoglake
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U hoglake" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # cache-from only: PRs read main's CD cache (scope=server), never
      # write it — no poisoning surface.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server
          load: true
          tags: hoglake-server:ci
          cache-from: type=gha,scope=server

      - name: Smoke - boots and answers /healthz against a real DB
        run: |
          docker run -d --name smoke --network host \
            -e HOGLAKE_JDBC_URL="jdbc:postgresql://localhost:5432/hoglake" \
            hoglake-server:ci
          for _ in $(seq 1 30); do
            if curl -fsS -m 2 http://localhost:8080/healthz; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke | tail -20
          [ "${ok:-}" = "1" ]

  deploy:
    # GATED ON CI: a main push deploys only after both suites pass —
    # a deliberate deviation from the millpond/duckgres convention of
    # running CD in parallel with CI (decided 2026-09-11).
    needs: [test, trino-test]
    # Forks must not push images or deployment dispatches.
    if: github.event_name == 'push' && github.repository == 'PostHog/hoglake'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: server-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch: the mw fleet runs Graviton nodes. The Dockerfile's
      # build stage is pinned to $BUILDPLATFORM, so gradle runs once
      # natively; only the JRE runtime layer is per-arch.
      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/posthog/hoglake-server:${{ github.sha }}
            ghcr.io/posthog/hoglake-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      # The promotable ref is the multi-arch MANIFEST digest — never a
      # per-arch digest (see millpond/duckgres AGENT docs).
      - name: Get image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect --raw ghcr.io/posthog/hoglake-server:${{ github.sha }} | sha256sum | awk '{print "sha256:"$1}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Get deployer token
        id: deployer
        uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc # v3.0.0
        with:
          app_id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
          private_key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}

      # Deploy target: gigahog-server (state/gigahog-server.yaml in
      # PostHog/charts). Dev auto-promotes; prod waits on the
      # prod-promote-managed-warehouse approval gate.
      - name: Trigger deployment via Charts repo
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.deployer.outputs.token }}
          repository: PostHog/charts
          event-type: commit_state_update
          client-payload: |
            {
              "values": {
                "image": {
                  "sha": "${{ github.sha }}@${{ steps.digest.outputs.digest }}"
                }
              },
              "release": "gigahog-server",
              "commit": ${{ toJson(github.event.head_commit) }},
              "repository": ${{ toJson(github.repository) }},
              "labels": [],
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }
