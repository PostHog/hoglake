name: Webui

on:
  push:
    branches: [main]
    paths:
      - "webui/**"
      # The OpenAPI spec is the wire contract the console conforms to.
      - "server/src/main/resources/openapi/hoglake.yaml"
      - ".github/workflows/webui.yml"
  pull_request:
    branches: [main]
    paths:
      - "webui/**"
      - "server/src/main/resources/openapi/hoglake.yaml"
      - ".github/workflows/webui.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: webui-test-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - run: npm ci

      # `build` runs tsc -b first — the type gate.
      - name: Typecheck + build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Docker build + boot smoke
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          docker build -t hoglake-webui:ci webui/
          # Static proxy_pass resolves the upstream name at boot; give
          # nginx a resolvable alias so the smoke tests OUR config, not
          # DNS.
          docker network create smoke-net
          # No upstream on purpose: runtime DNS resolution means the
          # console must boot and probe green with the server absent
          # (the gigahog first-sync ordering finding, hoglake#4).
          docker run -d --name smoke --network smoke-net -p 8081:8080 hoglake-webui:ci
          for _ in $(seq 1 15); do
            if curl -fsS -m 2 http://localhost:8081/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke | tail -5
          [ "${ok:-}" = "1" ]
          # SPA still serves, and a proxied path fails soft (502/504
          # from nginx), never a container crash.
          curl -fsS -m 2 http://localhost:8081/ >/dev/null
          code=$(curl -s -o /dev/null -m 5 -w "%{http_code}" http://localhost:8081/healthz)
          echo "proxied /healthz without upstream -> $code"
          case "$code" in 502|504) : ;; *) echo "expected 502/504"; exit 1 ;; esac

  deploy:
    # GATED ON CI — see server.yml's deploy job for the decision note.
    needs: [test]
    if: github.event_name == 'push' && github.repository == 'PostHog/hoglake'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: webui-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: webui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/posthog/hoglake-webui:${{ github.sha }}
            ghcr.io/posthog/hoglake-webui:latest
          cache-from: type=gha,scope=webui
          cache-to: type=gha,scope=webui,mode=max

      - name: Get image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect --raw ghcr.io/posthog/hoglake-webui:${{ github.sha }} | sha256sum | awk '{print "sha256:"$1}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Get deployer token
        id: deployer
        uses: getsentry/action-github-app-token@5c1e90706fe007857338ac1bfbd7a4177db2f789 # v4.0.0
        with:
          app_id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
          private_key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}

      # Same trim as server.yml's deploy: repository_dispatch caps
      # client_payload at ~64KB and a squash-merge message is the PR
      # title plus its whole body (#69's was 74KB, rejecting the
      # dispatch). Message via env, never interpolated into run:.
      - name: Trim dispatch commit
        id: dispatch_commit
        env:
          HEAD_COMMIT: ${{ toJson(github.event.head_commit) }}
        run: |
          trimmed=$(printf '%s' "$HEAD_COMMIT" | jq -c \
            '{id, timestamp, author, committer, message: (.message | split("\n")[0] | .[0:200])}')
          printf 'json=%s\n' "$trimmed" >> "$GITHUB_OUTPUT"

      - name: Trigger deployment via Charts repo
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.deployer.outputs.token }}
          repository: PostHog/charts
          event-type: commit_state_update
          client-payload: |
            {
              "values": {
                "image": {
                  "sha": "${{ github.sha }}@${{ steps.digest.outputs.digest }}"
                }
              },
              "release": "gigahog-webui",
              "commit": ${{ steps.dispatch_commit.outputs.json }},
              "repository": ${{ toJson(github.repository) }},
              "labels": [],
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }
