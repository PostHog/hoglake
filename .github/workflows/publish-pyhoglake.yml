name: Publish pyhoglake

# Publishes pyhoglake to PyPI through OIDC trusted publishing (no API-token
# secret). Trigger: push a tag named pyhoglake-v<version> that matches the
# version in pyhoglake/pyproject.toml.
#
# PyPI side: the PostHog organization owns the pyhoglake project. Its trusted
# publisher pins this repo, this workflow file, and the `pypi` environment.
# GitHub side: the `pypi` environment only deploys from pyhoglake-v* tags.
#
# Pull requests that touch this workflow or the packaging config, and manual
# runs from a branch, do a dry run: lint, test, build, and smoke test, no
# publish.

on:
  push:
    tags:
      - "pyhoglake-v*"
  pull_request:
    paths:
      - ".github/workflows/publish-pyhoglake.yml"
      - "pyhoglake/pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a tag run: it may be halfway through the PyPI upload.
concurrency:
  group: publish-pyhoglake-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: uv sync --locked

      # Integration tests skip without a live server; this is the
      # unit/mocked layer (same split as ci-python.yml).
      - name: Tests
        run: uv run pytest -q

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Tag must match the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv version --short)
          if [ "$GITHUB_REF_NAME" != "pyhoglake-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      # A clean env with only the wheel installed catches files missing from
      # the package. The version check fails if __version__ drifts from
      # pyproject.toml again.
      - name: Smoke test the wheel
        run: |
          expected=$(uv version --short)
          installed=$(uv run --isolated --no-project --with ./dist/pyhoglake-*.whl python -c "import pyhoglake; print(pyhoglake.__version__)")
          if [ "$installed" != "$expected" ]; then
            echo "::error::Installed wheel reports version $installed, expected $expected"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyhoglake-dist
          path: pyhoglake/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [lint, test, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pyhoglake/
    permissions:
      id-token: write # PyPI trusted publishing and the GitHub attestation
      attestations: write # stores the GitHub attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyhoglake-dist
          path: dist/

      # GitHub-side SLSA provenance, verifiable with `gh attestation verify`.
      # The PyPI upload below adds its own PEP 740 attestations by default.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  github-release:
    name: Create GitHub release
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # creates the GitHub release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyhoglake-dist
          path: dist/

      # --latest=false keeps the server's vX.Y.Z release as the repo's latest.
      - name: Create release with the published files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#pyhoglake-v}"
          # PEP 440 pre and dev releases carry letters (1.1.0rc1, 1.0.1.dev0).
          prerelease=false
          if [[ "$version" =~ [a-z] ]]; then
            prerelease=true
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "pyhoglake $version" \
            --notes "Published to PyPI: https://pypi.org/project/pyhoglake/$version/" \
            --verify-tag \
            --latest=false \
            --prerelease="$prerelease"
