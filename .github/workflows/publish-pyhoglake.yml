name: Publish pyhoglake

# Publishes pyhoglake to PyPI through OIDC trusted publishing (the
# posthog-python pattern: pypa/gh-action-pypi-publish, no API-token
# secret). Trigger: push a tag named pyhoglake-v<version> that matches
# the version in pyhoglake/pyproject.toml.

on:
  push:
    tags:
      - "pyhoglake-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Tag must match the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#pyhoglake-v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag pyhoglake-v$tag does not match pyproject version $version" >&2
            exit 1
          fi

      - run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Integration tests skip without a live server; this is the
      # unit/mocked layer (same split as ci-python.yml).
      - name: Tests
        run: uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyhoglake-dist
          path: pyhoglake/dist/
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The PyPI trusted publisher for the pyhoglake project pins this
    # workflow file and this environment name.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pyhoglake-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
