name: Python live tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Live client suites
        run: bash ci/live-python.sh

      - name: Test reports and service logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-python-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/live-python/
          include-hidden-files: true
          if-no-files-found: error

  # The millrace live docker suite (Phase 5, docs/kafka-ingestion-plan.md).
  # A second job in THIS reusable workflow rather than a new workflow: every
  # caller (server.yml's server-checks gate, pyhoglake-checks.yml under
  # python-checks, bench-image.yml's publish gate) fans it in with no new
  # required-check name — "require the gate, not the leaf" (AGENT.md), and
  # no suite lives outside CI. Fails on skips the same as live-python.sh.
  live-millrace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Live millrace suite
        run: bash ci/live-millrace.sh

      - name: Test reports and service logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-millrace-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/live-millrace/
          include-hidden-files: true
          if-no-files-found: error
