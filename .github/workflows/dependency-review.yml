name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vulnerability gate only for now. A license allow-list (millpond
      # ci.yaml has the pattern) needs the union of atoms across three
      # ecosystems (gradle, npm, uv) — add it once the dependency set
      # settles rather than starting with day-one false failures.
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
