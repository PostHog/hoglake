name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Vulnerability gate only for now. A license allow-list (millpond
      # ci.yaml has the pattern) needs the union of atoms across three
      # ecosystems (gradle, npm, uv) — add it once the dependency set
      # settles rather than starting with day-one false failures.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
