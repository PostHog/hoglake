name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Vulnerability gate only for now. A license allow-list (millpond
      # ci.yaml has the pattern) needs the union of atoms across three
      # ecosystems (gradle, npm, uv) — add it once the dependency set
      # settles rather than starting with day-one false failures.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
