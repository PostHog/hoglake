name: CI python

on:
  push:
    branches: [main]
    paths:
      - "pyhoglake/**"
      - "hedgerow/**"
      - "bench/**"
      # The OpenAPI spec is the wire contract the clients conform to.
      - "server/src/main/resources/openapi/hoglake.yaml"
      - ".github/workflows/ci-python.yml"
      - ".github/workflows/pyhoglake-checks.yml"
      - ".github/workflows/python-live.yml"
      - "ci/**"
  pull_request:
    branches: [main]
    paths:
      - "pyhoglake/**"
      - "hedgerow/**"
      - "bench/**"
      - "server/src/main/resources/openapi/hoglake.yaml"
      - ".github/workflows/ci-python.yml"
      - ".github/workflows/pyhoglake-checks.yml"
      - ".github/workflows/python-live.yml"
      - "ci/**"

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Combine all Python checks, including the live client suites.
  python-checks:
    if: always()
    needs: [pyhoglake, check]
    runs-on: ubuntu-latest
    steps:
      - name: Require Python checks and live suites
        env:
          CLIENT_RESULT: ${{ needs.pyhoglake.result }}
          OTHER_RESULT: ${{ needs.check.result }}
        run: test "$CLIENT_RESULT" = success && test "$OTHER_RESULT" = success

  pyhoglake:
    uses: ./.github/workflows/pyhoglake-checks.yml

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hedgerow
            lint: "true"
          # bench passes `ruff check` but carries a formatting backlog;
          # lint joins when that lands as its own diff (AGENT.md open
          # items).
          - component: bench
            lint: "false"
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: uv sync --locked

      - name: Lint (ruff, pinned in dev deps)
        if: matrix.lint == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The reusable pyhoglake checks run both clients against a live stack.
      - name: Tests
        run: uv run pytest -m "not integration" -q
