name: CI python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # EVERY PR AND MAIN PUSH RUNS THIS WORKFLOW; the path filter lives in
  # this job, not on the trigger, because `python-checks` below is a
  # REQUIRED CHECK and a required check has to be produced on every PR
  # (AGENT.md, "Required checks run on every PR"). A job skipped by
  # `if:` reports `skipped`, which the ruleset accepts.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - "pyhoglake/**"
              - "hedgerow/**"
              - "bench/**"
              # The OpenAPI spec is the wire contract the clients
              # conform to.
              - "server/src/main/resources/openapi/hoglake.yaml"
              # Server files the client's parity tests parse, so that a
              # server-only change to them reds here rather than on the
              # next unrelated pyhoglake PR: test_variant_ddl.py reads
              # VariantShredding.kt's limits, vocabularies and column
              # messages, ColumnTrees.kt's container message (ops.py
              # raises it), Identifiers.kt's cap, Model.kt's ColType
              # vocabulary (as test_transforms.py and test_nested.py
              # read Model.kt too), and the request seeds of the
              # shredding fuzz corpus (its JDK check also reads
              # build.gradle.kts and the Dockerfile, which change with
              # every dependency bump and are left out: only a JDK
              # downgrade could red that check).
              - "server/src/main/kotlin/com/posthog/hoglake/model/Model.kt"
              - "server/src/main/kotlin/com/posthog/hoglake/service/VariantShredding.kt"
              - "server/src/main/kotlin/com/posthog/hoglake/service/ColumnTrees.kt"
              - "server/src/main/kotlin/com/posthog/hoglake/service/Identifiers.kt"
              - "server/src/test/resources/com/posthog/hoglake/fuzz/VariantShreddingFuzzTestInputs/**"
              - ".github/workflows/ci-python.yml"
              - ".github/workflows/pyhoglake-checks.yml"
              - ".github/workflows/python-live.yml"
              - "ci/**"

  # THE GATE, and the check the ruleset requires. It is this job and not
  # `pyhoglake` or `check` so that the live client suites (run inside
  # pyhoglake-checks) cannot be red on a PR that merges: #304 wired the
  # live suites in while they were failing and merged on a ruleset that
  # required only the leaf jobs, and main was red for two hours until
  # #306. A gate that is not required is a comment.
  # Runs (and fails) when `changes` itself failed: a skipped gate
  # passes the ruleset, so a broken filter must not read as "nothing
  # to check".
  python-checks:
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true')
    needs: [changes, pyhoglake, check]
    runs-on: ubuntu-latest
    steps:
      - name: Require Python checks and live suites
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLIENT_RESULT: ${{ needs.pyhoglake.result }}
          OTHER_RESULT: ${{ needs.check.result }}
        run: |
          test "$CHANGES_RESULT" = success &&
            test "$CLIENT_RESULT" = success &&
            test "$OTHER_RESULT" = success

  pyhoglake:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/pyhoglake-checks.yml

  check:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hedgerow
            lint: "true"
          # bench passes `ruff check` but carries a formatting backlog;
          # lint joins when that lands as its own diff (AGENT.md open
          # items).
          - component: bench
            lint: "false"
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv sync --locked

      - name: Lint (ruff, pinned in dev deps)
        if: matrix.lint == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The reusable pyhoglake checks run both clients against a live stack.
      - name: Tests
        run: uv run pytest -m "not integration" -q
