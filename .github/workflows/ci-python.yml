name: CI python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # EVERY PR AND MAIN PUSH RUNS THIS WORKFLOW; the path filter lives in
  # this job, not on the trigger, because `python-checks` below is a
  # REQUIRED CHECK and a required check has to be produced on every PR
  # (AGENT.md, "Required checks run on every PR"). A job skipped by
  # `if:` reports `skipped`, which the ruleset accepts.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      codec: ${{ steps.filter.outputs.codec }}
      codec-source: ${{ steps.filter.outputs.codec-source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - "pyhoglake/**"
              - "pyhoglake-variant-codec/**"
              - "hedgerow/**"
              - "millrace/**"
              - "bench/**"
              # The uv workspace root: one lock for all four trees.
              - "pyproject.toml"
              - "uv.lock"
              # The OpenAPI spec is the wire contract the clients
              # conform to.
              - "server/src/main/resources/openapi/hoglake.yaml"
              # Server files the client's parity tests parse, so that a
              # server-only change to them reds here rather than on the
              # next unrelated pyhoglake PR: test_variant_ddl.py reads
              # VariantShredding.kt's limits, vocabularies and column
              # messages, ColumnTrees.kt's container message (ops.py
              # raises it), Identifiers.kt's cap, Model.kt's ColType
              # vocabulary (as test_transforms.py and test_nested.py
              # read Model.kt too), and the request seeds of the
              # shredding fuzz corpus (its JDK check also reads
              # build.gradle.kts and the Dockerfile, which change with
              # every dependency bump and are left out: only a JDK
              # downgrade could red that check). dependabot.yml is in the
              # filter too:
              # test_pyarrow_floor.test_the_latest_pyarrow_canary_keeps_the_dependency_cooldown
              # holds the pyarrow canary's cooldown to its uv cooldown.
              - "server/src/main/kotlin/com/posthog/hoglake/model/Model.kt"
              - "server/src/main/kotlin/com/posthog/hoglake/service/VariantShredding.kt"
              - "server/src/main/kotlin/com/posthog/hoglake/service/ColumnTrees.kt"
              - "server/src/main/kotlin/com/posthog/hoglake/service/Identifiers.kt"
              - "server/src/test/resources/com/posthog/hoglake/fuzz/VariantShreddingFuzzTestInputs/**"
              - ".github/dependabot.yml"
              - ".github/workflows/ci-python.yml"
              - ".github/workflows/pyhoglake-checks.yml"
              - ".github/workflows/python-live.yml"
              - ".github/workflows/variant-codec-wheels.yml"
              - "ci/**"
            # What the codec's wheels are built and tested from, the
            # lock (pyarrow, the test env) included.
            codec:
              - "pyhoglake-variant-codec/**"
              - "uv.lock"
              - ".github/workflows/variant-codec-wheels.yml"
              - "ci/variant-codec-wheel.sh"
              - "ci/variant_codec_smoke.py"
            # What a codec release is built from.
            codec-source:
              - "pyhoglake-variant-codec/src/**"
              - "pyhoglake-variant-codec/Cargo.*"
              - "pyhoglake-variant-codec/pyproject.toml"
              - "pyhoglake-variant-codec/rust-toolchain.toml"

  # THE GATE, and the check the ruleset requires. It is this job and not
  # `pyhoglake`, `check` or `millrace` so that the live client suites (run inside
  # pyhoglake-checks) cannot be red on a PR that merges: #304 wired the
  # live suites in while they were failing and merged on a ruleset that
  # required only the leaf jobs, and main was red for two hours until
  # #306. A gate that is not required is a comment.
  # Runs (and fails) when `changes` itself failed: a skipped gate
  # passes the ruleset, so a broken filter must not read as "nothing
  # to check".
  # The codec's wheels are gated only when the codec changed, and its
  # version check only on a PR that changes its source.
  python-checks:
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.python == 'true')
    needs: [changes, pyhoglake, check, millrace, variant-codec-wheels, codec-version]
    runs-on: ubuntu-latest
    steps:
      - name: Require Python checks and live suites
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLIENT_RESULT: ${{ needs.pyhoglake.result }}
          OTHER_RESULT: ${{ needs.check.result }}
          MILLRACE_RESULT: ${{ needs.millrace.result }}
          WHEELS_RESULT: ${{ needs.variant-codec-wheels.result }}
          CODEC_CHANGED: ${{ needs.changes.outputs.codec }}
          VERSION_RESULT: ${{ needs.codec-version.result }}
        run: |
          test "$CHANGES_RESULT" = success &&
            test "$CLIENT_RESULT" = success &&
            test "$OTHER_RESULT" = success &&
            test "$MILLRACE_RESULT" = success &&
            { test "$VERSION_RESULT" = success || test "$VERSION_RESULT" = skipped; } &&
            { test "$WHEELS_RESULT" = success ||
              { test "$CODEC_CHANGED" != true && test "$WHEELS_RESULT" = skipped; }; }

  pyhoglake:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/pyhoglake-checks.yml

  # The codec's manylinux wheels and sdist, each tested on its platform;
  # the artifacts stay on the run for later PRs to use. The other
  # platforms build on a release tag, or a manual run of
  # publish-pyhoglake-variant-codec.yml (design-native-encoder section 6).
  variant-codec-wheels:
    needs: changes
    if: needs.changes.outputs.codec == 'true'
    uses: ./.github/workflows/variant-codec-wheels.yml
    with:
      all-platforms: false

  # A codec change ships under a version not yet released: a new one, or
  # a .dev one (pyhoglake's extra pins exact codec releases).
  codec-version:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.codec-source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR's merge commit and the base, its first parent
      - name: A codec change has a new or .dev version
        run: |
          version() { git show "$1:pyhoglake-variant-codec/pyproject.toml" | grep -m1 '^version = ' | cut -d'"' -f2; }
          new=$(version HEAD) old=$(version HEAD^1)
          [ -n "$new" ] && [ -n "$old" ] || { echo "::error::cannot read the codec's version"; exit 1; }
          case "$new" in *.dev*) exit 0 ;; esac
          if [ "$new" = "$old" ]; then
            echo "::error::pyhoglake-variant-codec changed but is still $new: bump its version, or make it .dev"
            exit 1
          fi

  check:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hedgerow
            lint: "true"
          # bench passes `ruff check` but carries a formatting backlog;
          # lint joins when that lands as its own diff (AGENT.md open
          # items).
          - component: bench
            lint: "false"
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - run: uv sync --locked

      - name: Lint (ruff, pinned in dev deps)
        if: matrix.lint == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The reusable pyhoglake checks run both clients against a live stack.
      - name: Tests
        run: uv run pytest -m "not integration" -q

  millrace:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: millrace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - run: uv sync --locked

      - name: Lint (ruff, pinned in dev deps)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      # Phase 2 integration tests (file:/// SlateDB: hard-kill
      # durability, contested-open fencing) need no services, so the
      # whole suite runs here; the LIVE docker stack suite (tests/live/,
      # marker `live`) is deselected by tests/conftest.py and runs
      # through ci/live-millrace.sh in the reusable python-live.yml
      # workflow (the `live-millrace` job). Benches stay deselected
      # (non-gating; conftest drops the bench marker without --bench).
      - name: Tests
        run: uv run pytest -q

      # M8: mutation-test the pure core (keyspace.py + planner.py — the
      # [tool.mutmut] scope) on every millrace change. Clean-slate:
      # mutmut 3.8's incremental stats go stale on function renames
      # (tests/MUTATION_TESTING.md), so `mutants/` is deleted first; a
      # full run is ~4 min here, well inside this job's budget, so no
      # incremental mode. The survivors gate (tests/check_mutants.py)
      # fails on any survivor the ledger does not name.
      - name: Mutation tests (pure core) + survivors gate
        run: |
          rm -rf mutants
          uv run mutmut run
          uv run python tests/check_mutants.py
