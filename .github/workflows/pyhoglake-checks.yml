name: pyhoglake checks

# Lint, type check, tests, build, and wheel smoke test for pyhoglake. CI and
# the publish workflow both call it, so a PyPI upload is gated by the same
# checks as every pull request.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-live:
    uses: ./.github/workflows/python-live.yml

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check . ../ci
          uv run ruff format --check . ../ci

      - name: Mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv sync --locked

      # Live integration runs in python-live; this matrix checks the unit layer.
      - name: Tests
        run: uv run pytest -m "not integration" -q

  # The unit suite on every pyarrow pyhoglake claims: the declared floor
  # (pyproject.toml), millpond's pin, the lock, and the newest release. The
  # VARIANT footer splice and layout checks rest on what pyarrow writes into
  # a footer (which fields, in what order) and on how it reads a stamped
  # file back, the floor's other reason is the statistics of an INT32/INT64
  # decimal, and the lock alone pins none of it for an install that
  # resolves another version. tests/test_pyarrow_floor.py checks this list
  # names the floor, so raising one without the other reds.
  #
  # "latest" is a canary, not a gate: it resolves whatever pyarrow is newest
  # when it runs, so a release would otherwise turn python-checks (and the
  # pyhoglake publish, which runs these checks) red on a change that did
  # nothing. It still reports its failure on the run; the pinned entries
  # are the ones that block. It installs the newest pyarrow at least 7
  # days old, not the newest: the canary runs a release's native code
  # across the whole suite, on every run and in the publish run, so it
  # keeps dependabot.yml's cooldown, and a malicious or broken release
  # ages out before it runs here. It still trips on a release, a week on.
  pyarrow:
    name: Unit tests (pyarrow ${{ matrix.pyarrow }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.pyarrow == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        pyarrow: ["23.0.0", "23.0.1", "locked", "latest"]
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv sync --locked

      # Over the locked environment, so everything else stays as tested;
      # `uv run --no-sync` below keeps uv from putting the lock back.
      - name: Install pyarrow ${{ matrix.pyarrow }}
        if: matrix.pyarrow != 'locked'
        env:
          PYARROW: ${{ matrix.pyarrow }}
        run: |
          if [ "$PYARROW" = latest ]; then
            uv pip install --upgrade \
              --exclude-newer "$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" pyarrow
          else
            uv pip install "pyarrow==$PYARROW"
          fi

      - name: Report the pyarrow under test
        env:
          PYARROW: ${{ matrix.pyarrow }}
        run: |
          installed=$(uv run --no-sync python -c "import pyarrow; print(pyarrow.__version__)")
          echo "pyarrow $installed"
          case "$PYARROW" in
            locked|latest) ;;
            *) test "$installed" = "$PYARROW" ;;
          esac

      - name: Tests
        run: uv run --no-sync pytest -m "not integration" -q

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Tag must match the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv version --short)
          if [ "$GITHUB_REF_NAME" != "pyhoglake-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      # A clean env with only the wheel installed catches files missing from
      # the package. The version check fails if __version__ drifts from
      # pyproject.toml again.
      - name: Smoke test the wheel
        run: |
          expected=$(uv version --short)
          installed=$(uv run --isolated --no-project --with ./dist/pyhoglake-*.whl python -c "import pyhoglake; print(pyhoglake.__version__)")
          if [ "$installed" != "$expected" ]; then
            echo "::error::Installed wheel reports version $installed, expected $expected"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyhoglake-dist
          path: pyhoglake/dist/
          if-no-files-found: error
