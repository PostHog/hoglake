name: pyhoglake checks

# Lint, type check, tests, build, and wheel smoke test for pyhoglake. CI and
# the publish workflow both call it, so a PyPI upload is gated by the same
# checks as every pull request.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-live:
    uses: ./.github/workflows/python-live.yml

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check . ../ci
          uv run ruff format --check . ../ci

      - name: Mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor: one workspace lock means one requires-python,
        # and millrace's PEP 695 syntax needs 3.12 (root pyproject.toml).
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv sync --locked

      # Live integration runs in python-live; this matrix checks the unit layer.
      - name: Tests
        run: uv run pytest -m "not integration" -q

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Tag must match the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv version --short)
          if [ "$GITHUB_REF_NAME" != "pyhoglake-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      # -o dist: inside the workspace uv writes to the ROOT's dist/ by
      # default; the smoke test and the artifact read pyhoglake/dist/.
      - name: Build sdist and wheel
        run: uv build -o dist

      # A clean env with only the wheel installed catches files missing from
      # the package. The version check fails if __version__ drifts from
      # pyproject.toml again.
      - name: Smoke test the wheel
        run: |
          expected=$(uv version --short)
          installed=$(uv run --isolated --no-project --with ./dist/pyhoglake-*.whl python -c "import pyhoglake; print(pyhoglake.__version__)")
          if [ "$installed" != "$expected" ]; then
            echo "::error::Installed wheel reports version $installed, expected $expected"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyhoglake-dist
          path: pyhoglake/dist/
          if-no-files-found: error
