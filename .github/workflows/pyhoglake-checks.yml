name: pyhoglake checks

# Lint, type check, tests, build, and wheel smoke test for pyhoglake. CI and
# the publish workflow both call it, so a PyPI upload is gated by the same
# checks as every pull request.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-live:
    uses: ./.github/workflows/python-live.yml

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check . ../ci
          uv run ruff format --check . ../ci

      - name: Mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv sync --locked

      # Live integration runs in python-live; this matrix checks the unit layer.
      - name: Tests
        run: uv run pytest -m "not integration" -q

  packed-clickhouse:
    name: Packed ClickHouse round trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: uv sync --locked

      - name: Prepare pinned clickhouse-local wrapper
        env:
          CLICKHOUSE_IMAGE: >-
            clickhouse/clickhouse-server:26.9.8.3@sha256:230b973a00b5bac5b8925bd2898fae95a039aa6f25063fa8c507ffe9e2c7d770
        run: |
          docker pull "$CLICKHOUSE_IMAGE"
          cat > "$RUNNER_TEMP/clickhouse-local" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -i --network none \
            --user "\$(id -u):\$(id -g)" \
            --volume /tmp:/tmp \
            --entrypoint clickhouse \
            "$CLICKHOUSE_IMAGE" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/clickhouse-local"
          echo "PYHOGLAKE_CLICKHOUSE=$RUNNER_TEMP/clickhouse-local" >> "$GITHUB_ENV"

      # This is the real ClickHouse writer/reader path: it verifies the
      # one-file data.packed layout, Arrow type round-trip, readonly attach,
      # and an exact two-part snapshot. The output assertion makes a skip a
      # failure instead of a green job.
      - name: Mandatory packed adapter round trip and multi-part read
        run: |
          output=$(uv run pytest -q -rA \
            tests/test_packed.py::test_real_clickhouse_packed_append_and_snapshot_read)
          printf '%s\n' "$output"
          case "$output" in
            *"1 passed"*) ;;
            *) echo "::error::mandatory packed ClickHouse test did not pass"; exit 1 ;;
          esac

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Tag must match the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv version --short)
          if [ "$GITHUB_REF_NAME" != "pyhoglake-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      # A clean env with only the wheel installed catches files missing from
      # the package. The version check fails if __version__ drifts from
      # pyproject.toml again.
      - name: Smoke test the wheel
        run: |
          expected=$(uv version --short)
          installed=$(uv run --isolated --no-project --with ./dist/pyhoglake-*.whl python -c "import pyhoglake; print(pyhoglake.__version__)")
          if [ "$installed" != "$expected" ]; then
            echo "::error::Installed wheel reports version $installed, expected $expected"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyhoglake-dist
          path: pyhoglake/dist/
          if-no-files-found: error
