name: pyhoglake checks

# Lint, type check, tests, build, and wheel smoke test for pyhoglake. One
# definition for both callers: ci-python.yml runs it on every pyhoglake
# change, and publish-pyhoglake.yml runs it before a PyPI upload.

on:
  workflow_call:
    outputs:
      version:
        description: The pyhoglake version in pyproject.toml
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: uv sync --locked

      # Integration tests skip without a live server; this is the
      # unit/mocked layer. The live layer runs locally, per the AGENT.md
      # pre-push checklist.
      - name: Tests
        run: uv run pytest -q

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: pyhoglake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Read the package version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: uv build

      # A clean env with only the wheel installed catches files missing from
      # the package. The version check fails if __version__ drifts from
      # pyproject.toml again.
      - name: Smoke test the wheel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          installed=$(uv run --isolated --no-project --with ./dist/pyhoglake-*.whl python -c "import pyhoglake; print(pyhoglake.__version__)")
          if [ "$installed" != "$VERSION" ]; then
            echo "::error::Installed wheel reports version $installed, expected $VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyhoglake-dist
          path: pyhoglake/dist/
          if-no-files-found: error
