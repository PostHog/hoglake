name: Semgrep

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SEMGREP_ENABLE_VERSION_CHECK: "false"

jobs:
  semgrep-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Digest matches millpond's pinned semgrep container (semgrep 1.x).
      image: semgrep/semgrep@sha256:3dab091ee3247fce7e4ed3df9f92b3bd72692c083295f53cec3f135b86404db1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep
        run: |
          semgrep \
            --config "p/python" \
            --config "p/owasp-top-ten" \
            --config "p/security-audit" \
            --error \
            --metrics=off \
            --verbose \
            pyhoglake/ hedgerow/ bench/

  semgrep-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep@sha256:3dab091ee3247fce7e4ed3df9f92b3bd72692c083295f53cec3f135b86404db1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep
        run: |
          semgrep \
            --config "p/kotlin" \
            --config "p/java" \
            --config "p/owasp-top-ten" \
            --config "p/security-audit" \
            --error \
            --metrics=off \
            --verbose \
            server/

  semgrep-general:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep@sha256:3dab091ee3247fce7e4ed3df9f92b3bd72692c083295f53cec3f135b86404db1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep
        run: |
          semgrep \
            --config "p/owasp-top-ten" \
            --config "p/security-audit" \
            --config "p/trailofbits" \
            --config "p/github-actions" \
            --error \
            --metrics=off \
            --verbose \
            --exclude ./pyhoglake/ \
            --exclude ./hedgerow/ \
            --exclude ./bench/ \
            --exclude ./server/ \
            .
