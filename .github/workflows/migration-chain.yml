name: Migration chain

# ITS OWN WORKFLOW, WITH NO PATH FILTER, BECAUSE IT IS A REQUIRED CHECK.
# The main ruleset requires a check named `migration-chain` on every
# PR. It used to be a job of server.yml, which runs only for
# `server/**` changes — so a PR that touched nothing under server/
# (webui, pyhoglake, docs) never produced the check and could not be
# merged at all (#299 sat BLOCKED with every check green). A required
# check has to run on every PR, and this one is a checkout plus git
# commands, so running it unconditionally costs seconds.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Flyway detects a duplicate migration version only at runtime, and a
  # PR's checks run against the merge result AT PUSH TIME — a migration
  # that lands on main after this PR's last CI run makes the green
  # checks stale (PR #65 collided with #66's V4 exactly this way, with
  # every check passing). This job fetches main FRESH at run time and
  # checks the union, so a re-run — or a merge-queue run — catches the
  # collision. Residual gap: nothing forces the re-run; "require
  # branches to be up to date before merging" closes it fully.
  migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No duplicate versions, no edits to shipped migrations
        env:
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'migration-chain-override') }}
        run: |
          git fetch --no-tags --depth=1 origin main
          MIG=server/src/main/resources/db/migration

          # Append-only: every migration file on CURRENT main must be
          # byte-identical here. Only additions are allowed. The
          # `migration-chain-override` label skips this half for a PR
          # that repairs a chain no database can have applied (two
          # PRs each added the same version; the second to merge left
          # main unable to boot, and its file had to be renumbered).
          # The duplicate-version half below never skips.
          bad=$(git diff --name-status origin/main HEAD -- "$MIG" | grep -v '^A' || true)
          if [ -n "$bad" ] && [ "$OVERRIDE" != "true" ]; then
            echo "::error::Migration chain is append-only; changed or removed vs latest main:"
            echo "$bad"
            echo "::error::A repair of an unapplied chain may carry the migration-chain-override label."
            exit 1
          elif [ -n "$bad" ]; then
            echo "::warning::migration-chain-override label present; append-only check skipped for:"
            echo "$bad"
          fi

          # Version collision: one basename per V<number> across the
          # union of latest main and this branch. A file this branch
          # removes from main (only possible under the override) leaves
          # the union, or a repair of a duplicate on main could never
          # pass its own check.
          removed=$(git diff --name-only --no-renames --diff-filter=D origin/main HEAD -- "$MIG" | sed 's:.*/::')
          { git ls-tree -r --name-only origin/main -- "$MIG" | sed 's:.*/::' | grep -v -x -F -f <(printf '%s\n' "$removed")
            git ls-files -- "$MIG" | sed 's:.*/::'; } |
            grep -E '^V[0-9]+__[^/]+\.sql$' | sort -u |
            sed -E 's/^V([0-9]+)__.*/\1 &/' | sort -n |
            awk '$1 == prev { printf "::error::Duplicate migration version V%s: %s and %s\n", $1, last, $2; dup = 1 }
                 { prev = $1; last = $2 }
                 END { exit dup }'

          # Ordering: a new migration must be numbered ABOVE everything
          # already on main. Flyway (outOfOrder=false, our setting)
          # refuses a pending version below an applied one, so a branch
          # that merges "under" main's max wedges every deployed
          # database at startup — dev auto-deploys, so that wedge is
          # immediate. (#65 landed V6 while V5 was still on a branch;
          # this check would have forced the branch to renumber.)
          main_max=$(git ls-tree -r --name-only origin/main -- "$MIG" |
            grep -E '/V[0-9]+__[^/]+\.sql$' | sed -E 's:.*/V([0-9]+)__.*:\1:' | sort -n | tail -1)
          comm -13 \
            <(git ls-tree -r --name-only origin/main -- "$MIG" | grep -E '\.sql$' | sed 's:.*/::' | sort) \
            <(git ls-files -- "$MIG" | grep -E '\.sql$' | sed 's:.*/::' | sort) |
            grep -E '^V[0-9]+__' | sed -E 's/^V([0-9]+)__.*/\1 &/' | sort -n |
            awk -v max="$main_max" '
              $1 <= max { printf "::error::Migration %s is numbered at or below main'\''s newest (V%s); renumber above it\n", $2, max; bad = 1 }
              END { exit bad }'

