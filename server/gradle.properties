# The Kotlin compile daemon inherits the Gradle JVM heap, which defaults to 512 MB.
# Compiling the test source set (about 70k lines) exceeded that on CI with
# "GC overhead limit exceeded" (PR #220, 2026-09-25). Give both JVMs room.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g
