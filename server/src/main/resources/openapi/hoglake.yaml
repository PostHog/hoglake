          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 10000
                  items: { $ref: "#/components/schemas/FileRegistration" }
      responses:
        "200":
          description: Durable operation state; inspect state and reason, not HTTP status alone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TableCreation" }
        "400":
          description: Malformed JSON or invalid operation UUID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Operation or catalog lock wait exceeded the configured timeout; retry with the same operation ID
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retrying }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Invalid definition or file registrations; no publication occurred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /catalogs/{catalog}/table-creations/{operation}/commit/uploads:
