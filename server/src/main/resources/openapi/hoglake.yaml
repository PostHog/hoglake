  /catalogs/{catalog}/table-creations/{operation}/commit:
    post:
      operationId: publishTableCreation
      summary: Atomically publish the table, initial files, and durable receipt in one snapshot
      description: >
        Requires atomic-table-creation-v1 capability. Without a replacement guard the target
        must be absent at publication. With the atomic-table-replacement-v1 guard, target
        identity and all target changes since read_snapshot are checked under the commit lock.
        A replacement retires the old incarnation and publishes a new UUID at one snapshot.
        Stale or expired guards return a durable rejected receipt with reason target_changed.
        The exact ordered file list is compared as JSON on retries; an identical retry
        returns the original terminal result even if the table was subsequently dropped.
        Up to 10000 unique file paths, all under the operation write_path. Empty files
        creates an empty table. No object-store reads occur during publication.
        Aborted or expired operations cannot publish. Terminal receipts are retained.
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { name: operation, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
