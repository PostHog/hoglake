  /catalogs/{catalog}/commit/receipts/{operation}:
    get:
      operationId: getCommitReceipt
      summary: Look up a durable catalog-scoped commit receipt
      description: >
        Available with idempotent-append-v1. Uses the same deployment access
        boundary as the catalog commit API. A 404 is not proof that an in-flight
        request has stopped. Receipts survive rename, drop and snapshot expiry
        and have no expiration. No file paths or request payload are returned.
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - name: operation
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema:
                type: object
                required: [operation_id, snapshot_id, schema_version]
                properties:
                  operation_id: { type: string, format: uuid }
                  snapshot_id: { type: integer, format: int64 }
                  schema_version: { type: integer, format: int64 }
        "400":
          description: Invalid operation UUID
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog}/commit/prepared:
    post:
      operationId: commitPrepared
      summary: Publish an immutable request with durable replay protection
      description: >
        Same commit semantics as /commit, but requires idempotency_key.
        Clients requiring replay protection use this endpoint so that an older
        server cannot silently ignore the key. Receipts survive snapshot expiry.
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/CommitRequest" }
                - type: object
                  required: [idempotency_key]
      responses:
        "200":
          description: Committed, or the original result of an identical replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Commit conflict
        "422":
          description: Invalid request, missing key, or key reused with another payload
        "503":
          description: Commit admission timed out; retry the identical request

  /catalogs/{catalog}/uploads/{upload}:
    put:
      operationId: claimUpload
      summary: Claim a fresh object path before uploading
      description: >
        Requires claimed-uploads-v1. Generates a unique server path under prefix,
        which must be inside catalog data_path. Replaying upload ID requires the
        same owner, prefix and kind and returns the same path and current state.
        Owner is the durable commit key or table-creation operation ID. Lease is
        24 hours. Active claims protect objects even if erroneously queued.
        Registered and abandoned states are permanent fences against path reuse.
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { name: upload, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, prefix, file_kind]
              properties:
                owner: { type: string, format: uuid }
                prefix: { type: string }
                file_kind: { type: string, enum: [data, delete] }
      responses:
        "200":
          description: Durable claim (replay may return a terminal state)
          content:
            application/json:
              schema:
                type: object
                required: [upload_id, owner, prefix, path, file_kind, state, expires_at]
                properties:
                  upload_id: { type: string, format: uuid }
                  owner: { type: string, format: uuid }
                  prefix: { type: string }
                  path: { type: string }
                  file_kind: { type: string, enum: [data, delete] }
                  state: { type: string, enum: [active, registered, abandoned] }
                  expires_at: { type: string, format: date-time }
        "409": { description: Upload identity reused with different intent }
        "422": { description: Invalid prefix or file kind }

  /catalogs/{catalog}/uploads/renew:
    post:
      operationId: renewUploads
      summary: Extend active claims for an owner by 24 hours
      description: >
        Never revives an abandoned or registered claim: the state predicate is
        re-evaluated after any row-lock wait, so it serializes with expiry and
        publication without taking the per-catalog commit lock.
      parameters: [{ $ref: "#/components/parameters/catalog" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner]
              properties:
                owner: { type: string, format: uuid }
      responses:
        "200":
          description: Number of active leases renewed
          content:
            application/json:
              schema: { type: object, properties: { renewed: { type: integer } } }

  /catalogs/{catalog}/uploads/abandon:
    post:
      operationId: abandonUploads
      summary: Fence selected uncommitted uploads owned by this operation
      description: Registered claims are immutable; unknown publication outcomes can never be rolled back by this call.
      parameters: [{ $ref: "#/components/parameters/catalog" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, paths]
              properties:
                owner: { type: string, format: uuid }
                paths: { type: array, maxItems: 10000, items: { type: string } }
      responses:
        "200":
          description: Number fenced (already registered, terminal or differently owned paths are unchanged)
          content:
            application/json:
              schema: { type: object, properties: { abandoned: { type: integer } } }

  /catalogs/{catalog}/uploads/schedule-expired:
    post:
      operationId: scheduleExpiredUploads
      summary: Explicitly fence expired uploads and queue abandoned paths for cleanup
      description: >
        No background job invokes this endpoint. Expired active claims become
        abandoned and abandoned paths are queued for the existing
        retained-reference-aware cleanup drain. No bucket scan occurs, and no
        catalog commit lock is taken: each fence is one state-checking UPDATE, so
        a claim a concurrent publication settled is left alone. A path a data or
        deletion-vector file row already claims is never queued. Tombstones remain
        permanent and later invocations revisit abandoned paths so PUTs finishing
        after an earlier DELETE remain reclaimable, but a tombstone rests for the
        drained-ledger retention between offers rather than being revisited on
        every call. Selection is bounded and rotates by last scheduling time. This
        never deletes an object itself; existing cleanup triggers and configuration
        still control draining. The `scheduled` count is how many claims this call
        actually FENCED, not how many it considered: a candidate that a concurrent
        publication settled, or that a renewal extended, is left alone and is not
        counted. A rested tombstone whose path a data or deletion-vector file row
        still references IS re-fenced and counted, but queues nothing - the count
        is claims fenced, never paths queued.
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 } }
      responses:
        "200":
          description: Number of claims actually fenced (see the description)
          content:
            application/json:
              schema: { type: object, properties: { scheduled: { type: integer } } }
        "422": { description: Limit outside allowed range }

  /catalogs/{catalog}/commit/uploads:
    post:
      operationId: commitUploads
      summary: Publish files with durable upload ownership
      description: >
        Requires claimed-uploads-v1. All target tables require expected_table_uuid.
        Fresh upload claims referenced by path must be active, match idempotency_key as
        owner and match the file kind. Registered immutable objects with retained
        references of that kind may be referenced again without transferring ownership. Registration, claim settlement and receipt
        commit atomically under the catalog lock. Deletes use the prepared mutation
        conflict contract. Identical replay returns the original receipt. Older
        replicas return 404; no fallback is permitted for claimed paths.
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/CommitRequest" }
                - type: object
                  required: [idempotency_key, read_snapshot]
      responses:
        "200":
          description: Committed, or the original result of an identical replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Commit conflict
        "422":
          description: Invalid request, missing key, or key reused with another payload
        "503":
          description: Commit admission timed out; retry the identical request

  /catalogs/{catalog}/commit/transaction:
    post:
      operationId: commitTransaction
      summary: Publish a multi-table DML transaction atomically
      description: >
        Requires atomic-dml-transactions-v1. Every target requires expected_table_uuid.
        Tables this transaction DELETES from must be unchanged since read_snapshot
        (inserts, deletes and DDL all conflict); a table it only appends to conflicts
        with DDL alone, so an append-only transaction does not conflict with a
        concurrent insert into its targets. A statement that READ a table but
        produced no deletion vector for it (a MERGE or UPDATE whose predicate
        matched nothing) MUST therefore still send a delete group for that table
        with an empty files list, exactly as commitPreparedMutation documents, or
        it keeps no read-set protection. Compaction never conflicts: it changes
        which files back a table, never which rows are visible in it - but a
        deletion vector whose target data file was retired since read_snapshot
        by compaction or another commit is a 409 (it was a 422 before this
        contract), so re-read and re-publish against the compaction output. Optional
        data_file_path deletion references address exactly one
        same-table append in this commit, with data_file_id zero. Numeric references
        retain ordinary snapshot visibility and vector-growth checks. Upload claims,
        all file registrations and the full-payload receipt commit in one catalog-locked
        transaction. Replay returns the original receipt. A missing receipt is not a
        fence. Older replicas return 404; no fallback is permitted. This endpoint
        provides snapshot isolation with write-write conflict detection, not validation
        of a transaction's read-only tables or cross-catalog atomicity.
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/CommitRequest" }
                - type: object
                  required: [idempotency_key, read_snapshot]
      responses:
        "200":
          description: Committed, or the original result of an identical replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Commit conflict: a delete-target table changed since
            read_snapshot, a DDL change on any touched table, a table
            incarnation mismatch, or a targeted data file that was live at
            read_snapshot and has since been retired (by compaction or
            another commit). All are retryable after re-reading. Expiry is
            NOT among them: for expiry to have removed a file live at
            read_snapshot, read_snapshot must be below the floor, and the
            floor guard returns 410 before any per-file check runs.
        "422":
          description: Invalid request, missing key, or key reused with another payload
        "503":
          description: Commit admission timed out; retry the identical request

  /catalogs/{catalog}/commit/deletes/prepared:
    post:
      operationId: commitPreparedDelete
      summary: Atomically publish guarded deletion vectors with durable replay protection
      description: >
        Requires idempotent-delete-v1, idempotency_key, read_snapshot, non-empty
        deletes with expected_table_uuid on each group, and no appends. Empty file
        lists are allowed for zero-row statements and still validate the table.
        All files publish in one snapshot. Replays of the identical full payload
        return the original receipt before current-state validation, including
        after DDL or expiry. A missing receipt does not fence in-flight publication.
        Retain uploaded vectors on ambiguous outcomes. Roll out to all server
        replicas before enabling connector DELETE.
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/CommitRequest" }
                - type: object
                  required: [idempotency_key, read_snapshot, deletes]
      responses:
        "200":
          description: Committed, or the original result of an identical replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Commit conflict
        "422":
          description: Invalid request, missing key, or key reused with another payload
        "503":
          description: Commit admission timed out; retry the identical request

  /catalogs/{catalog}/commit/mutations/prepared:
    post:
      operationId: commitPreparedMutation
      summary: Atomically publish guarded appends and deletion vectors with durable replay protection
      description: >
        Requires idempotent-mutation-v1, idempotency_key, read_snapshot and non-empty
        deletes with expected_table_uuid on every delete and append group. A delete
        group with an empty files list anchors insert-only and zero-row mutations.
        Appends and deletion vectors publish together in one snapshot. Every DELETE
        target table must be unchanged since read_snapshot, including inserts,
        deletes and DDL; a table this request only appends to conflicts with DDL
        alone. Compaction never conflicts — it changes which files back a table, not
        which rows are visible in it — but a deletion vector whose target file
        compaction retired since read_snapshot is a 409, not a 422. Unrelated table
        changes do not conflict. Full-payload
        replay, including the stronger conflict contract, returns the original result
        before current-state validation. A changed payload is rejected. Missing
        receipts do not fence in-flight publication; preserve uploads on unknown
        outcomes. Deploy to all replicas before enabling SQL UPDATE and MERGE.
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/CommitRequest" }
                - type: object
                  required: [idempotency_key, read_snapshot, deletes]
      responses:
        "200":
          description: Committed, or the original result of an identical replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Commit conflict: a guarded delete target changed since
            read_snapshot, a DDL change on a touched table, a table
            incarnation mismatch, or a targeted data file that was live at
            read_snapshot and has since been retired (by compaction or
            another commit). All are retryable after re-reading. Expiry is
            NOT among them: for expiry to have removed a file live at
            read_snapshot, read_snapshot must be below the floor, and the
            floor guard returns 410 before any per-file check runs.
        "422":
          description: Invalid request, missing key, or key reused with another payload
        "503":
          description: Commit admission timed out; retry the identical request

  /catalogs/{catalog}/commit:
    post:
      operationId: commit
      summary: >
        The append commit: register client-written parquet files with
        footer-derived stats. record_count is mandatory per file (row-id
        range assignment); column stats may be omitted (stats_mode=deferred)
        and are then hydrated asynchronously.
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitRequest" }
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
        "409":
          description: >
            Commit conflict (concurrent DDL on a touched table). The
            client refreshes its read snapshot and retries.


            Error code `table_dropped` is the one 409 a retry cannot
            fix: a table the commit named EXISTS but has been dropped,
            and the detail carries the snapshot it was dropped in. It is
            typed apart from the 422 below because "you named a table
            that does not exist" and "the table you were writing to was
            dropped out from under you" are different facts with
            different remedies, and both used to arrive as the same
            `unknown table` validation failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: Validation failure (unknown table, bad stats shape,
            unknown field ids, duplicate delete target — a commit carries
            at most one superseding deletion vector per data file; merge
            deleted positions client-side and register the union)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: >
            Commit admission timed out: the commit transaction's
            lock_timeout (HOGLAKE_COMMIT_LOCK_TIMEOUT_MS, default 30s,
            0 disables) expired while queuing on the per-catalog commit
            lock. Error code `commit_queue_timeout`. Explicit, retryable
            backpressure — never a generic 500; back off per the
            Retry-After header and retry the identical commit.
          headers:
            Retry-After:
              description: Seconds to back off before retrying.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ---- CDC publications (SPECIFIED, NOT YET IMPLEMENTED: all return 501) ----
  # The WAL tap: a catalog-managed publication tails a table's changefeed
  # and produces its rows directly to Kafka. The publisher's progress is a
  # first-class consumer offset (consumer_id "publication:{name}"), so the
  # retention floor protects an unpublished range exactly as it protects
  # any lagging consumer. Delivery is at-least-once; records are keyed by
  # (table_uuid, row_id) so compacted topics converge. Deletes are emitted
  # from deletion-vector diffs as tombstone-shaped records.
  /catalogs/{catalog}/publications:
    get:
      operationId: listPublications
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      responses:
        "200":
          description: Publications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Publication" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: createPublication
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePublicationRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /catalogs/{catalog}/publications/{publication}:
    get:
      operationId: getPublication
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - name: publication
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Publication with live status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      operationId: dropPublication
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - name: publication
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed (its consumer offset is released) }
        "501": { $ref: "#/components/responses/NotImplemented" }

  # ---- DR / export (SPECIFIED, NOT YET IMPLEMENTED: returns 501) ----
  # The consistent-export half of the DR story (README "PITR + consistent
  # export"): one response proving what the object store must contain for
  # the catalog to be whole. Everything is read at ONE snapshot (head at
  # request time), so a PITR-restored catalog can be diffed against the
  # bucket: every listed path must exist; anything else is orphaned.
  /catalogs/{catalog}/export:
    get:
      operationId: exportCatalog
      summary: >
        Consistent catalog export manifest: the snapshot range
        (earliest..head, with the floor time), the live-file manifest
        (data files + live deletion vectors per table, read at head),
        and every consumer offset. JSON in v1; an Arrow variant may
        follow.
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      responses:
        "200":
          description: Export manifest, consistent at head_snapshot_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportManifest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /debug/decode-bound:
    post:
      operationId: decodeBound
      summary: >
        Stateless decode of one Iceberg single-value encoding — the
        incident tool. Paste a column type name and the base64 of a
        stored bound (a hog_file_column_stats bound, a value out of a
        log line), get the decoded JSON scalar back under the same wire
        conventions FileColumnStats documents. Reads nothing, writes
        nothing, touches no catalog. This endpoint parses hostile input
        by design, so every failure is a NAMED 422 (or a 400 for a
        malformed body), never a 500: an unknown type name gets the
        type-parity refusal (a permanently unsupported DuckLake name —
        int128, geometry, ... — gets its own reason, never
        "unknown"); malformed base64, wrong-length or empty bytes,
        variant/container types, NaN float/double bytes (a NaN is never
        a bound — StatsSanity refuses one at every door), an
        out-of-day time and a non-UTF-8 string bound each answer a 422
        naming the rule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecodeBoundRequest" }
      responses:
        "200":
          description: The decoded JSON scalar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecodeBoundResponse" }
        "400":
          description: >
            Malformed body — unparseable JSON, a missing required
            field, a JSON null body, or a body sent under a
            Content-Type this API does not read (bare curl -d posts
            x-www-form-urlencoded).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: >
            Named refusal — unknown/refused type name, a non-string
            or over-cap (1024 decoded bytes) value, malformed base64,
            wrong-length bytes, NaN, out-of-domain value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /info:
    get:
      operationId: getInstanceInfo
      summary: >
        Identity of this hoglake instance: the operator-configured
        display name (HOGLAKE_INSTANCE_NAME, e.g. "GigaHog") the webui
        shows so deployments are tellable apart. Name omitted when
        unset. Carries the running server's version and, when the image
        came off the pipeline, its build stamp — the webui shows both
        beside the brand so the deployed build is readable without
        shelling in. Also carries instance-wide live-data totals for the
        webui header: sums over live data files (end_snapshot unset)
        across every catalog, refreshed by the server's periodic metrics
        sampler — display numbers, not a consistency primitive.
        total_rows is gross of deletion-vector masking. Both totals are
        omitted in the boot window before the first sample.
      responses:
        "200":
          description: Instance info
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  name: { type: string }
                  version:
                    type: string
                    description: >
                      The running server's version, as built (e.g.
                      1.0.1-dev). Always present: "unknown" when the
                      binary carries no version resource, never omitted.
                  build:
                    type: string
                    description: >
                      Packaging stamp identifying WHICH build this is,
                      within a version that stays constant between
                      releases (e.g. 20260915T2104Z, a UTC build time).
                      Supplied by the pipeline that packages the image,
                      so it is OMITTED on any build nobody stamped —
                      every local build and every PR image. Absent means
                      "not off the pipeline", not an error. Opaque and
                      display-only: never parse it for ordering you
                      depend on.
                  total_rows: { type: integer, format: int64 }
                  total_size_bytes: { type: integer, format: int64 }

  /catalogs/{catalog}/consumers:
    get:
      operationId: listConsumers
      summary: >
        Every consumer in the catalog with its per-table offsets, table
        names resolved (a dropped table keeps its last name and is
        flagged — offsets outlive a plain drop so consumers see
        incarnation changes). A row on an incarnation that atomic
        REPLACEMENT retired is the exception: it is deleted once that
        consumer commits on the replacing incarnation at or past the
        replacement snapshot, so such rows disappear from this listing.
        Ordered by consumer id, then namespace.table.
      parameters:
        - { $ref: "#/components/parameters/catalog" }
      responses:
        "200":
          description: Consumers and their offsets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerList" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog}/consumers/{consumer}/offsets:
    get:
      operationId: listConsumerOffsets
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/consumer" }
      responses:
        "200":
          description: Offsets for this consumer
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsumerOffset" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog}/consumers/{consumer}/offsets/{tableUuid}:
    get:
      operationId: getConsumerOffset
      summary: One (consumer, table_uuid) offset; 404 when none is stored.
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/consumer" }
        - name: tableUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stored offset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerOffset" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: commitConsumerOffset
      summary: >
        Commit a consumer offset. Monotonic: a snapshot below the stored
        offset is rejected with 409.

        Committing at or past an incarnation's creation snapshot also
        DELETES this caller's offset rows on the incarnations that one
        replaced, transitively along the replacement chain, in the same
        transaction. Reaching the successor is the caller's own statement
        that it reconciled across the replacement, and a row on a retired
        incarnation can never be advanced again by anyone — on a
        consumer_floor catalog it would pin snapshot expiry forever. Only
        this consumer's rows are touched; another consumer that has not
        reconciled keeps its position. The deleted rows stop appearing in
        listConsumers.
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/consumer" }
        - name: tableUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot_id]
              properties:
                snapshot_id: { type: integer, format: int64 }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerOffset" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  parameters:
    catalog:
      name: catalog
      in: path
      required: true
      schema: { type: string }
    namespace:
      name: namespace
      in: path
      required: true
      schema: { type: string }
    table:
      name: table
      in: path
      required: true
      schema: { type: string }
    consumer:
      name: consumer
      in: path
      required: true
      schema: { type: string }
    snapshot:
      name: snapshot
      in: query
      required: false
      description: Time travel; defaults to head. Mutually exclusive
        with at_timestamp.
      schema: { type: integer, format: int64 }
    atTimestamp:
      name: at_timestamp
      in: query
      required: false
      description: >
        Time travel by timestamp (ISO-8601 instant WITH a UTC offset,
        e.g. 2026-09-05T00:00:00Z; an offset-less local datetime is a
        400 bad_request): resolves to the largest snapshot with
        snapshot_time <= at_timestamp. Mutually exclusive with snapshot
        (422 if both). Before the earliest retained snapshot -> 410;
        after head -> head.
      schema: { type: string, format: date-time }
    maintenanceBatch:
      name: batch
      in: query
      required: false
      description: Per-run bound override (expire default 10000
        snapshots, cleanup default 2000 queue entries, compact
        default 1 group).
      schema: { type: integer }

  responses:
    NotImplemented:
      description: Specified but not yet implemented.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Gone:
      description: >
        The requested snapshot (or resolved timestamp) is below the
        expiry floor — that history has been expired. Re-read at a
        retained snapshot. The detail names the floor and, once expiry
        has advanced it, the time the floor was reached
        (Catalog.earliest_snapshot_time).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }

    Catalog:
      type: object
      required: [name, data_path, head_snapshot_id, schema_version]
      properties:
        name: { type: string }
        data_path: { type: string }
        capabilities: { type: array, items: { type: string }, description: "Includes atomic-table-creation-v1, idempotent-append-v1, idempotent-delete-v1, idempotent-mutation-v1, guarded-table-lifecycle-v1, atomic-table-replacement-v1 guarded-schema-evolution-v1 recursive-write-schema-v1 atomic-partitioned-table-creation-v1 atomic-sorted-table-creation-v1 and versioned-table-metadata-v1 and claimed-uploads-v1 and atomic-dml-transactions-v1 when supported" }
        head_snapshot_id: { type: integer, format: int64 }
        schema_version: { type: integer, format: int64 }
        earliest_snapshot_time:
          type: string
          format: date-time
          nullable: true
          description: >
            snapshot_time of the expiry-floor snapshot
            (earliest_snapshot_id), captured when expiry advanced the
            floor. Absent/null until expiry has ever advanced it. 410
            responses below the floor cite this time so consumers know
            WHEN their range was lost.
        table_count:
          type: integer
          format: int64
          description: >
            Live (undropped) tables, from the metrics sampler's last
            pass. Display number, not a consistency primitive.
        live_rows:
          type: integer
          format: int64
          description: >
            Rows across live data files, from the same sample. Gross of
            deletion-vector masking, as GET /v1/info's totals are.
        live_size_bytes:
          type: integer
          format: int64
          description: >
            Bytes across live data files, from the same sample. All
            three totals are OMITTED — never zeroed — for a catalog the
            sampler has not covered yet (the boot window, or one created
            since the last pass): an unsampled catalog and an empty one
            are different facts.
        oldest_snapshot_time:
          type: string
          format: date-time
          description: >
            Commit time of the oldest RETAINED snapshot
            (MIN(snapshot_time)), from the same sample as the totals and
            OMITTED under the same rule until first sampled. Unlike
            earliest_snapshot_time this does not wait on expiry: a
            never-expired catalog still retains its first snapshot, and
            this reports it. An instant, not an age — clients render the
            elapsed time so it stays live between samples.

    CreateCatalogRequest:
      type: object
      required: [name, data_path]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,62}$" }
        data_path: { type: string }

    Namespace:
      type: object
      required: [name, namespace_id]
      properties:
        name: { type: string }
        namespace_id: { type: integer, format: int64, description: Stable identity; not reused after namespace deletion. }

    TableCreation:
      type: object
      required: [operation_id, table_uuid, namespace, name, columns, write_path, state, expires_at]
      properties:
        operation_id: { type: string, format: uuid }
        table_uuid: { type: string, format: uuid }
        namespace: { type: string }
        name: { type: string }
        columns:
          type: array
          items: { $ref: "#/components/schemas/Column" }
        write_path: { type: string }
        state: { type: string, enum: [prepared, committed, rejected, aborted] }
        expires_at: { type: string, format: date-time, description: Prepared operations expire after 24 hours; terminal receipts do not expire }
        snapshot_id: { type: integer, format: int64 }
        schema_version: { type: integer, format: int64 }
        reason:
          type: string
          enum: [target_exists, target_changed, namespace_changed, client_abort, expired,
                 definition_invalid]
          description: >
            Why a `rejected` receipt cannot be published.
            `definition_invalid` means the definition was legal when it
            was PREPARED and is not any more — a rule tightened between
            prepare and publish. The receipt is terminal: prepare a new
            one with a definition the current server accepts. (Without
            this the operation stayed `prepared` forever, since the
            failing publish rolled itself back and only an explicit
            abort could end it.)

    CustomProperties:
      type: object
      maxProperties: 100
      description: >
        Inert user metadata. Replaced as a whole by set_properties; an empty object clears it.
        Keys are lowercase ASCII identifiers; hoglake. and trino. prefixes and
        partitioning, sorted_by, location, format, comment are reserved. No NUL in values.
      propertyNames: { pattern: "^[a-z][a-z0-9_.-]{0,127}$" }
      additionalProperties: { type: string, maxLength: 4096 }

    ColumnDef:
      type: object
      required: [name, type]
      properties:
        comment: { type: [string, "null"], maxLength: 16384, description: "Versioned comment; no NUL. Requires versioned-table-metadata-v1 for writes." }
        name:
          type: string
          # PATTERN STAYS IN ITS SIBLING POSITION. Every other identifier
          # in this spec declares it here, and a generator reads
          # `schema.pattern`: moving it inside a composition keyword
          # made column names the one field with NO pattern as far as
          # codegen is concerned,
          # which is strictly worse than the gap it was fixing. The
          # `not` below carries the prefix rule for validators that
          # implement it; generators that ignore it are no worse off
          # than before, and the description states the rule for the
          # humans writing the client.
          pattern: "^[A-Za-z_][A-Za-z0-9_-]{0,127}$"
          not: { pattern: "^_hog" }
          description: >
            Identifier policy (shared by namespace/table/view/column
            names): letter or underscore start, then letters, digits,
            underscore, hyphen; max 128 chars.

            COLUMN names carry one rule the others do not: the `_hog`
            prefix is RESERVED, at every nesting level, for hoglake's own
            physical columns (compaction writes `_hog_row_id` into every
            output, bound by a reserved field id). A column named
            `_hog...` collides with it, so create_table, add_column and
            rename_column all refuse one — including a field inside a
            struct, a list element or a map value.

            Both violations are 422. The reserved-prefix refusal names
            the offending DOTTED PATH, so a rejected struct field says
            where it is: "column name 'addr._hog_x' uses the reserved
            prefix '_hog'".

            The prefix rule is a sibling `not`, not a negative
            lookahead inside `pattern`: lookahead is legal ECMA-262 but
            RE2 — which Go clients generate against — cannot compile it,
            and a client that fails to build is worse than one that
            checks the prefix a layer up.
        type:
          type: string
          enum: [boolean, int8, int16, int, long, uint8, uint16, uint32,
                 uint64, float, double, decimal, date, time, timestamp_s,
                 timestamp_ms, timestamp, timestamp_ns, timestamptz,
                 string, json, uuid, binary, variant,
                 list, struct, map]
          description: >
            The closed column-type vocabulary: every member has a
            defined Iceberg facade mapping (iceberg-federation.md §2),
            which is the membership rule. VARIANT maps to Iceberg v3 variant and
            requires native Parquet VARIANT(1), with its field ID on the group.
            VARIANT has no whole-column statistics and cannot be a partition or
            sort source. Scalar compaction skips tables containing VARIANT.

            Stats bounds for a column are stored — and returned — in the
            Iceberg single-value binary serialization of the MAPPED
            Iceberg type, not of the hoglake type. Consequences worth
            knowing before decoding: int8/int16/uint8/uint16 bounds are
            4-byte little-endian ints; uint32 bounds are 8-byte
            little-endian longs; uint64 bounds are the minimal
            two's-complement big-endian unscaled value of a
            decimal(20,0); timestamp_s and timestamp_ms bounds are
            MICROSECONDS since the epoch (like timestamp), while
            timestamp_ns bounds are NANOSECONDS; json bounds are UTF-8
            bytes, like string.

            list, struct and map are CONTAINERS: they carry no values of
            their own, they require `children`, and they NEVER carry
            stats. Bounds and counts are per LEAF field — the element of
            a list, the key and value of a map, the scalar fields of a
            struct — so a commit shipping column_stats for a container's
            field_id is refused with a 422. They map natively to the
            Iceberg V2 list/struct/map, element/key/value field ids
            included.

            Shape rules, each its own named 422: a list has exactly one
            child, named `element`; a map has exactly two, `key` then
            `value`, and the key must have nullable=false (Iceberg map
            keys are non-nullable); a struct has one or more children,
            which keep their own names; a scalar type has none. Nesting
            depth is capped at 8, counting a top-level column as 1.

            These DuckLake type names are permanently unsupported and
            are refused with a 422 naming the type and the reason, never
            an unknown-type error: int128 and uint128 (39 decimal
            digits, past Iceberg's widest exact numeric decimal(38)),
            timetz and interval (no Iceberg mapping), and the geometry
            family — point, linestring, polygon, multipoint,
            multilinestring, multipolygon, linestring_z,
            geometrycollection (out of scope).
        type_params:
          type: object
          additionalProperties: true
        nullable: { type: boolean, default: true }
        children:
          type: array
          items: { $ref: "#/components/schemas/ColumnDef" }
          description: >
            Required for list/struct/map, forbidden for every scalar
            type. Recursive, bounded by the depth cap above.

    Column:
      allOf:
        - $ref: "#/components/schemas/ColumnDef"
        - type: object
          required: [field_id, ordinal]
          properties:
            field_id: { type: integer, format: int64 }
            ordinal:
              type: integer
              description: >
                0-based position among the column's SIBLINGS — top-level
                columns share one sequence, and each container's children
                have their own. Not a table-wide position.
            children:
              type: array
              items: { $ref: "#/components/schemas/Column" }
              description: >
                Present only for list/struct/map, with the field ids the
                server assigned. Ids are allocated depth-first, so a
                container's id is always below its descendants'.

    CreateTableRequest:
      type: object
      required: [name, columns]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_-]{0,127}$"
        columns:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ColumnDef" }

    TableSummary:
      type: object
      required: [name, table_uuid, record_count, file_count, file_size_bytes,
                 snapshot_count]
      properties:
        name: { type: string }
        table_uuid: { type: string, format: uuid }
        comment:
          type: [string, "null"]
          maxLength: 16384
          description: >
            The table's comment as of the listed snapshot (head), from
            the same versioned row the name comes from. Absent when the
            table has no comment; a server older than this field omits
            it too, so a client must treat absent and null alike.
        record_count:
          type: integer
          format: int64
          description: >
            Rows in the data files LIVE at head, the same aggregate the
            Table object reports — never the gross append counter. It is
            GROSS of deletion vectors: a row masked by a live DV is still
            counted, because the count comes from each file's registered
            record_count and nothing subtracts the DVs. Deliberate, for
            parity with the Table object, which answers the same way; a
            net count needs the per-file DV join and belongs to a
            surface that says so.
        file_count:
          type: integer
          format: int64
          description: Data files live at head.
        file_size_bytes:
          type: integer
          format: int64
          description: Total size of the data files live at head.
        snapshot_count:
          type: integer
          format: int64
          description: >
            How many RETAINED snapshots carry a change row for this
            table. Snapshots are catalog-wide, so a table's snapshots
            are defined through the change log: distinct snapshot ids at
            or above the catalog's earliest_snapshot_id whose change row
            names this table (the table-scoped change kinds —
            table_created / table_dropped / table_altered /
            table_inserted_into / table_deleted_from / table_compacted).
            It SHRINKS as expiry advances the floor: it is what a reader
            can still time-travel to, not the table's lifetime commit
            count.
        earliest_snapshot_id:
          type: [integer, "null"]
          format: int64
          description: >
            The smallest snapshot id counted by snapshot_count — the
            oldest point this table can still be read at. Absent when no
            retained snapshot carries a change row for the table (every
            one of its commits has expired below the catalog floor).

    Table:
      type: object
      required: [name, namespace, table_uuid, columns, record_count,
                 file_count, file_size_bytes]
      properties:
        comment: { type: [string, "null"], maxLength: 16384 }
        properties: { $ref: "#/components/schemas/CustomProperties" }
        name: { type: string }
        namespace: { type: string }
        table_uuid: { type: string, format: uuid }
        columns:
          type: array
          items: { $ref: "#/components/schemas/Column" }
        record_count: { type: integer, format: int64 }
        file_count: { type: integer, format: int64 }
        file_size_bytes: { type: integer, format: int64 }
        partition_spec: { $ref: "#/components/schemas/PartitionSpec" }
        sort_spec: { $ref: "#/components/schemas/SortSpec" }
        snapshot_id:
          type: integer
          format: int64
          description: The snapshot the DDL commit created — present on
            createTable and alterTable responses so a transactional client
            can pin its post-DDL reads to the snapshot its own DDL made
            instead of racing a separate head read. Absent on reads
            (getTable resolves an arbitrary snapshot).

    ColumnStats:
      type: object
      required: [field_id, value_count, null_count]
      properties:
        field_id: { type: integer, format: int64 }
        value_count: { type: integer, format: int64 }
        null_count: { type: integer, format: int64 }
        nan_count: { type: integer, format: int64 }
        size_bytes: { type: integer, format: int64 }
        lower_bound:
          type: string
          format: byte
          description: Iceberg single-value binary serialization, base64.
        upper_bound:
          type: string
          format: byte

    FileRegistration:
      type: object
      required: [path, record_count, file_size_bytes]
      properties:
        path: { type: string, description: Absolute object-store URI }
        record_count: { type: integer, format: int64 }
        file_size_bytes: { type: integer, format: int64 }
        footer_size: { type: integer, format: int64 }
        column_stats:
          type: array
          description: Omit for deferred stats (file registers as pending).
          items: { $ref: "#/components/schemas/ColumnStats" }
        partition_values:
          type: array
          description: >
            Transformed partition values by key_index of the table's live
            spec. Required with matching arity when the table is
            partitioned; forbidden when not.
          items: { type: string, nullable: true }
        split_offsets:
          type: array
          minItems: 1
          maxItems: 100000
          items: { type: integer, format: int64, minimum: 0 }
          description: >
            OPTIONAL row-group start offsets, for a writer that holds the
            footer (footer-shipping) — the list GET .../scan returns as
            DataFile.split_offsets with `include=split_offsets`; see that
            property for the exact definition of each entry. One entry
            per row group, in row-group order.

            Validated, never repaired: the list must be non-empty, hold
            at most 100000 entries, be STRICTLY increasing, start at or
            above 0, and end below `file_size_bytes`. Anything else is a
            422 and the commit stores nothing. The server does not open
            the file, so it cannot check the entries against the footer;
            a writer that ships a list vouches for it.

            Omitted, the file's offsets are unknown. For a deferred-stats
            registration (no `column_stats`) the hydrator fills them from
            the footer it reads anyway, and its list REPLACES one shipped
            here. For a provided-stats registration nothing ever fills
            them: the file simply has none, readers cut it evenly, and
            that is acceptable — row-group alignment is an optimization,
            never a correctness input.

    TableAppend:
      type: object
      required: [namespace, table, files]
      properties:
        namespace: { type: string }
        table: { type: string }
        expected_table_uuid:
          type: string
          format: uuid
          description: >
            Optional incarnation guard. When present, the commit fails
            with 409 commit_conflict if the live table resolved by name
            carries a different table_uuid — i.e. the table was dropped
            and recreated since the writer read it. Absent = today's
            name-only resolution.
        files:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/FileRegistration" }

    CommitRequest:
      type: object
      description: At least one of appends/deletes must be non-empty.
      properties:
        idempotency_key:
          type: string
          format: uuid
          description: >
            Optional catalog-scoped publication identity (operation ID). With
            idempotent-append-v1, append groups, files and column statistics use
            canonical ordering; partition value ordering remains significant.
            The complete payload, including read snapshot, target UUIDs, and all
            registration fields, is compared. Equivalent request replays
            return the original result without writing, including after snapshot
            expiry. Reusing a key with a different request returns 422. Receipts
            are retained indefinitely. Persist the complete request before sending.
        read_snapshot:
          type: integer
          format: int64
          description: >
            The snapshot the writer planned against. Conflicts are
            evaluated against changes after this point. Defaults to head
            (no conflict window) for blind appends. REQUIRED when
            deletes are present (deletes always conflict-check).
        appends:
          type: array
          items: { $ref: "#/components/schemas/TableAppend" }
        deletes:
          type: array
          items: { $ref: "#/components/schemas/TableDeletes" }
        author: { type: string }
        message: { type: string }

    DeleteFileRegistration:
      type: object
      required: [data_file_id, path, delete_count, file_size_bytes]
      properties:
        data_file_id: { type: integer, format: int64, description: Zero only when data_file_path is supplied. }
        data_file_path:
          type: string
          description: >
            Only accepted by /commit/transaction. References exactly one append in the
            same table and same commit. This is a private staged-file reference, not
            a lookup of an existing file by path. data_file_id must be zero.
        path: { type: string, description: Puffin deletion-vector file URI }
        delete_count:
          type: integer
          format: int64
          description: >
            Total deleted positions in the DV. Must be >= the superseded
            DV's count (vectors only grow) and <= the data file's
            record_count.
        file_size_bytes: { type: integer, format: int64 }

    TableDeletes:
      type: object
      required: [namespace, table, files]
      properties:
        namespace: { type: string }
        table: { type: string }
        expected_table_uuid:
          type: string
          format: uuid
          description: >
            Optional incarnation guard; same semantics as
            TableAppend.expected_table_uuid (mismatch -> 409).
        files:
          type: array
          description: Empty for guarded zero-row statements through prepared, uploads or transaction commit endpoints.
          items: { $ref: "#/components/schemas/DeleteFileRegistration" }

    DeleteFile:
      type: object
      required: [delete_file_id, data_file_id, path, file_format,
                 delete_count, file_size_bytes, begin_snapshot]
      properties:
        delete_file_id: { type: integer, format: int64 }
        data_file_id: { type: integer, format: int64 }
        path: { type: string }
        file_format: { type: string, enum: [puffin-dv] }
        delete_count: { type: integer, format: int64 }
        file_size_bytes: { type: integer, format: int64 }
        begin_snapshot: { type: integer, format: int64 }

    ScanFile:
      type: object
      required: [data_file]
      properties:
        data_file: { $ref: "#/components/schemas/DataFile" }
        delete_file: { $ref: "#/components/schemas/DeleteFile" }

    PartitionField:
      type: object
      required: [source_field_id, transform]
      properties:
        source_field_id:
          type: integer
          format: int64
          description: >
            A LEAF column's field id. A struct's leaf field is legal
            (Iceberg's source-id may point at one); a nested container
            itself is not (no single value per row), and neither is
            anything under a list or a map (many values per row). Both
            are named 422s.
        transform:
          type: string
          enum: [identity, bucket, year, month, day, hour]
        transform_param:
          type: integer
          description: bucket(n) only.

    PartitionSpec:
      type: object
      required: [spec_id, fields]
      properties:
        spec_id: { type: integer, format: int64 }
        fields:
          type: array
          items: { $ref: "#/components/schemas/PartitionField" }

    PartitionFieldValues:
      type: object
      required: [source_field_id, transform, values, truncated]
      description: >
        One partition field with the distinct stored values it takes
        across a table's live files. `values` are the TRANSFORMED strings
        the writer stored, returned verbatim so the caller can echo one
        back as `partition=key_index:value` with no encoding on either
        side; `truncated` marks a field whose cardinality exceeded the cap,
        so a partial list is never mistaken for the whole set.
      properties:
        source_field_id: { type: integer, format: int64 }
        transform:
          type: string
          enum: [identity, bucket, year, month, day, hour]
        transform_param: { type: integer }
        values:
          type: array
          items: { type: [string, "null"] }
        truncated: { type: boolean }

    PartitionValues:
      type: object
      required: [spec_id, fields]
      properties:
        spec_id: { type: integer, format: int64 }
        fields:
          type: array
          items: { $ref: "#/components/schemas/PartitionFieldValues" }

    SortField:
      type: object
      required: [source_field_id, direction, null_order]
      properties:
        source_field_id:
          type: integer
          format: int64
          description: >
            A LEAF column's field id. A struct's leaf field is legal
            (Iceberg's source-id may point at one); a nested container
            itself is not (no single value per row), and neither is
            anything under a list or a map (many values per row). Both
            are named 422s.
        direction:
          type: string
          enum: [asc, desc]
        null_order:
          type: string
          enum: [nulls_first, nulls_last]

    SortSpec:
      type: object
      description: >
        The table's versioned sort order. ADVISORY for writers — the
        server never verifies that registered files are actually sorted —
        and BINDING for compaction rewrites, which sort merged rows by
        the live spec (safe because compaction outputs carry explicit
        row ids; see DataFile.explicit_row_ids).
      required: [sort_id, fields]
      properties:
        sort_id: { type: integer, format: int64 }
        fields:
          type: array
          items: { $ref: "#/components/schemas/SortField" }

    AlterOp:
      type: object
      required: [op]
      description: >
        Discriminated by `op`.

        Column-addressing ops (`drop_column`, `rename_column`,
        `promote_column`, and `add_column`'s `parent`) name their target
        by a DOTTED PATH of column names — `addr` for a top-level column,
        `addr.zip` for a field of the struct `addr`. Names cannot contain
        `.` (the identifier pattern), so the path is unambiguous.

        Only STRUCT interiors are addressable. A path stepping through a
        list or a map is a 422: Iceberg has no add/drop/rename for an
        element, a key or a value, and the container's shape is part of
        its type. Nested containers are also not promotable — promote a
        struct's LEAF field, which follows the ordinary scalar matrix.
      properties:
        comment: { type: [string, "null"], maxLength: 16384, description: "set_table_comment or set_column_comment; null or absent removes the comment." }
        properties: { $ref: "#/components/schemas/CustomProperties" }
        op:
          type: string
          enum: [add_column, drop_column, rename_column, promote_column,
                 rename_table, set_partition_spec, set_sort_order, add_column_with_metadata,
                 set_table_comment, set_column_comment, set_properties]
        column: { $ref: "#/components/schemas/ColumnDef" }   # add_column
        parent:                       # add_column, optional
          type: string
          description: >
            Dotted path of an existing STRUCT to append the new field
            to (new field id, ordinal = max sibling + 1). Absent = a new
            top-level column. Naming a list or a map here is a 422.
        name: { type: string }        # drop_column, promote_column
        from: { type: string }        # rename_column
        to:
          type: string
          description: >
            Dual-use: the new NAME for rename_column, the target TYPE
            for promote_column. It therefore carries no `pattern` of its
            own — a schema that constrained it to the identifier regex
            would reject every promote_column, whose values are type
            names from the ColumnDef.type vocabulary.

            For rename_column the value must satisfy ColumnDef.name in
            full: the identifier pattern AND the reserved `_hog` prefix
            rule. Both are 422s, with the same messages ColumnDef.name
            documents.
        new_name:                     # rename_table
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_-]{0,127}$"
        fields:                       # set_partition_spec ([] = unpartitioned)
          type: array
          items: { $ref: "#/components/schemas/PartitionField" }
        sort_fields:                  # set_sort_order ([] = unsorted)
          type: array
          items: { $ref: "#/components/schemas/SortField" }

    CommitResult:
      type: object
      required: [snapshot_id]
      description: >
        The receipt of a DDL/DML commit. Convention for how a mutating
        endpoint reports the snapshot it made: an endpoint that returns a
        DOMAIN OBJECT carries the snapshot as an optional `snapshot_id`
        field on that object (Table on create/alter), while an endpoint
        with no domain object returns this CommitResult (drop table,
        drop namespace, truncate, consumer offsets). Choose per endpoint;
        do not add a third idiom.
      properties:
        snapshot_id: { type: integer, format: int64 }
        schema_version: { type: integer, format: int64 }

    DataFile:
      type: object
      required: [data_file_id, path, file_format, record_count,
                 file_size_bytes, row_id_start, stats_state, begin_snapshot]
      properties:
        data_file_id: { type: integer, format: int64 }
        path: { type: string }
        file_format: { type: string }
        record_count: { type: integer, format: int64 }
        file_size_bytes: { type: integer, format: int64 }
        footer_size: { type: integer, format: int64 }
        row_id_start: { type: integer, format: int64 }
        stats_state: { type: string, enum: [provided, pending, failed] }
        begin_snapshot: { type: integer, format: int64 }
        spec_id: { type: integer, format: int64 }
        partition_values:
          type: array
          items: { type: string, nullable: true }
        explicit_row_ids:
          type: boolean
          default: false
          description: >
            True for compaction outputs: the file's hoglake row ids ride
            an explicit physical int64 column `_hog_row_id` (reserved
            parquet field id 2147483646) because merged inputs need not
            be row-id-contiguous. When true, row_id_start is
            min(input row ids) and has no positional meaning; readers
            needing row identity must read the column.
        ordering_bounds:
          $ref: '#/components/schemas/FileOrderingBounds'
        column_stats:
          type: array
          items: { $ref: "#/components/schemas/ScanColumnStats" }
          description: >
            The file's per-column statistics, for pruning files at
            planning time without opening their footers.

            Populated by GET .../scan ONLY, only with
            `include=column_stats`, and there only when stats_state is
            `provided`. GET .../files and the changefeed embed the same
            DataFile schema and omit this property; so does the scan plan
            for a `pending` or `failed` file, which has no statistics — an
            ABSENT property means "no statistics, do not prune this file".
            An EMPTY array is a different answer: the file is `provided`
            but has no statistics row for any requested column.

            BOUNDED: one plan carries at most 1000000 entries across all
            its files. Past that the whole request is a 422 rather than a
            truncated plan — a plan missing files is a wrong answer, and
            a plan whose statistics stop half way through is worse than
            one that never had them. `stats_fields` is the lever: it
            divides the per-file entry count by naming only the columns a
            predicate prunes on.

            WHAT THE CAP BOUNDS IS THE PAYLOAD, NOT THE READ. A narrowed
            request returns fewer entries; the server still reads the
            catalog's whole statistics relation to find them, because
            those rows carry no table id and one column's rows sit one
            per file across every page. Measured at 45M stored rows:
            about 1.6 s warm and 17 s cold, narrowed or not. Treat
            `include=column_stats` as a planning-time cost per scan, not
            as something `stats_fields` makes cheap.

            The plan's FILE list is not capped and is not paged. A scan
            returns every file visible at the snapshot however many
            there are; only the statistics are bounded.

            The entries are the rows GET .../files/{fileId}/stats answers
            for the same file at the same snapshot — same omissions,
            field-id order, identical bound tokens — narrowed to
            `stats_fields` when given, and without the per-table column
            identity (see ScanColumnStats). The array may omit columns: a
            variant or container never has a statistics row, a writer need
            not ship one for every column, a column added after the file
            landed has none, and a row whose column is not visible at the
            requested snapshot (a dropped column) is left out. A column
            absent from the array has no bounds and must not be pruned on.

            Bounds follow Iceberg single-value semantics: `lower_bound`
            is <= every non-null, non-NaN value of the column in the file
            and `upper_bound` is >= every one; they are bounds, not
            necessarily values that occur. hoglake never truncates or
            rounds a string or binary bound itself — the commit path stores
            what the writer shipped and the hydrator copies the parquet
            footer's min/max bytes verbatim — but a parquet writer may
            have truncated long string/binary statistics before hoglake
            saw them. A writer following the parquet specification keeps a
            truncated value a valid bound (a prefix for the minimum, an
            incremented prefix for the maximum), so it remains safe to
            prune on; it is NOT safe to report as the column's exact
            minimum or maximum (e.g. to answer min()/max() from metadata).
            A JSON null bound means "do not prune on this column", per
            FileColumnStats.

            PRE-DELETION-VECTOR, every entry. These statistics describe
            the file as it was WRITTEN. The scan plan hands you the live
            deletion vector for the same file alongside (ScanFile.
            delete_file), and nothing subtracts it from these numbers:
            `value_count`, `null_count` and `nan_count` count rows the
            vector may have deleted, and `lower_bound`/`upper_bound` may
            be the extremes of rows that are all deleted.

            PRUNING stays sound, because deletions only shrink the set of
            live values: a file whose bounds miss a predicate's range
            still has no live row that matches it, so skipping it is
            correct whatever the vector says. ANSWERING from these
            numbers is not sound — count(*), min() and max() pushed down
            to metadata are wrong by exactly the vector for any file that
            carries one. Apply the deletion vector, or read the file.
        split_offsets:
          type: array
          minItems: 1
          maxItems: 100000
          items: { type: integer, format: int64, minimum: 0 }
          description: >
            The file's row-group start offsets, for cutting byte-range
            splits on row-group boundaries (the Iceberg `split_offsets`
            convention).

            Populated by GET .../scan ONLY, only with
            `include=split_offsets`, and there only when the catalog holds
            offsets for the file. GET .../files and the changefeed embed
            the same DataFile schema and omit this property. An ABSENT
            property means the offsets are unknown: cut the file however
            you would without them (even byte ranges are always correct).
            Absence does not follow `stats_state` — a `provided` file
            registered without offsets has none, and a `pending` file may
            carry offsets its writer shipped.

            ONE ENTRY PER ROW GROUP, in row-group order. Entry i is the
            absolute byte offset in the file at which row group i's FIRST
            column chunk starts: that chunk's `dictionary_page_offset`
            when it has a dictionary page that precedes its first data
            page (parquet-java: `dictionary_page_offset > 0` and
            `< data_page_offset`), else its `data_page_offset` — exactly
            parquet-java's `ColumnChunkMetaData.getStartingPos()`. It is
            NOT the thrift `RowGroup.file_offset`, which some writers set
            wrongly. A reader that assigns a row group to the split
            containing this offset reads every row group exactly once for
            any cover of `[0, file_size_bytes)`.

            GUARANTEES when present: non-empty; at most 100000 entries;
            STRICTLY increasing; the first entry >= 0; the last entry <
            `file_size_bytes`. The server never returns a partial,
            unsorted or out-of-range list — it stores nothing instead —
            so a reader may use the list as given. These are the checks
            the server runs, not a proof the offsets match the bytes: for
            a footer-shipping registration they are the writer's claim;
            for a hydrated or compacted file they come from the footer
            the server read or wrote.

    ScanColumnStats:
      type: object
      required: [field_id, value_count, null_count, lower_bound, upper_bound]
      description: >
        One column's statistics for one file in a scan plan: a
        FileColumnStats entry without the column identity (name, path,
        type, type_params), which is per-TABLE and which the engine
        already holds by field_id — repeating it per file x column was
        the bulk of a wide table's plan.

        `size_bytes` is dropped too, and is the one dropped property
        that is NOT per-table: it is this column's compressed bytes in
        this file. It goes because it says nothing about whether the
        file can be pruned, which is this array's one job, and because
        it is one more integer per file x column on a response already
        capped for size. The server does not even read the column for a
        scan plan. Callers that want it ask GET
        .../files/{fileId}/stats, which is per-file and carries every
        FileColumnStats property.

        Counts and bounds here are PRE-DELETION-VECTOR; see
        DataFile.column_stats for what that does and does not license.
        `lower_bound`/`upper_bound`
        follow the FileColumnStats wire conventions and are the SAME
        tokens GET .../files/{fileId}/stats renders (one decoder); read
        that schema before consuming them. Two consequences engines get
        wrong: integer and decimal bounds must be parsed EXACTLY (raw
        token / BigInteger / BigDecimal, never through a double), and
        temporal bounds elide trailing zero units ("2026-09-05T00:00",
        "2026-09-05T00:00Z"), so they must be parsed as ISO-8601
        (ISO_LOCAL_DATE_TIME / ISO_OFFSET_DATE_TIME), never with a
        fixed-precision pattern.
      properties:
        field_id: { type: integer, format: int64 }
        value_count:
          type: integer
          format: int64
          description: >
            Values in the file for this column, nulls INCLUDED (Iceberg
            value_counts): a column is all-null in the file exactly when
            null_count == value_count.
        null_count: { type: integer, format: int64 }
        nan_count:
          type: integer
          format: int64
          description: NaN values (float/double only); absent when unknown.
        lower_bound:
          nullable: true
          description: Decoded lower bound, or null (do not prune on this column).
        upper_bound:
          nullable: true
          description: Decoded upper bound, or null (do not prune on this column).

    FileOrderingBounds:
      type: object
      required: [lower_bound, upper_bound]
      description: >
        The range this file covers along the key its table is ORDERED
        by — the span a reader prunes on, and the span that says
        whether two files overlap.

        Populated by GET .../files ONLY. The changefeed and the scan
        plan embed the same DataFile schema and omit this property:
        they answer "what changed" and "what to read", neither of which
        is a question about one column's span. (A scan plan can be ASKED
        for bounds instead, in DataFile.column_stats — opt-in via
        `include=column_stats`, and narrowed to the columns
        `stats_fields` names when it is given, so the leading sort key's
        bounds are in a plan only if the caller asked for that column.)

        Which key it describes follows the TABLE, not the file. When
        the table has a sort spec at the requested snapshot the bounds
        are the LEADING sort field's, and `field_id` names it — the
        leading field alone, because it is the only one whose per-file
        range is a contiguous interval (a second key orders only the
        rows that TIE on the first, so its per-file min/max spans the
        whole column and prunes nothing). When the table is unsorted
        the only ordering is the append order, so the bounds are the
        file's row-id span and `field_id` is ABSENT: the row id is not
        a catalog column and has no field id.

        The property is absent altogether when the server has no range
        to state: a sorted table's file with no stats row for the key
        (stats_state pending or failed, or a key column added after the
        file landed), and any file of zero records. The row-id span
        needs no statistics and is always given, deferred-stats files
        included — row_id_start is assigned at commit for every file.

        `lower_bound`/`upper_bound` follow the FileColumnStats wire
        conventions and are DECODED, so the same 2^53 warning applies:
        a row-id span or a long sort key exceeds what JSON.parse can
        hold exactly, and consumers must parse these tokens exactly.
        A JSON null is an ANSWER, never an absence: on a sort key it is
        "no bound stored, so do not prune"; on a row-id span's
        upper_bound it is "unknown", which is the honest answer for a
        compaction output — explicit_row_ids means row_id_start is
        min(input row ids), so `row_id_start + record_count - 1` is
        arithmetic on a meaning the file does not have, and the ids
        live in a `_hog_row_id` column that is not a catalog column and
        therefore has no statistics row to read a maximum out of.
      properties:
        field_id:
          type: integer
          format: int64
          description: >
            The sort-spec field these bounds belong to; absent when the
            table is unsorted and the bounds are the row-id span.
        lower_bound:
          nullable: true
          description: Decoded low end of the range, or null (see above).
        upper_bound:
          nullable: true
          description: Decoded high end of the range, or null (see above).

    FileColumnStats:
      type: object
      required: [field_id, name, path, type, value_count, null_count,
                 lower_bound, upper_bound]
      description: >
        One column's statistics for one data file, bounds DECODED from
        the stored Iceberg single-value serialization to plain JSON.

        The wire conventions, by mapped type family — shared verbatim
        by decodeBound, and pinned cross-language by the `wire` fields
        of pyhoglake/tests/vectors/bounds_vectors.json:

        * boolean -> JSON boolean.

        * EVERY integer type (int8..uint64) and decimal -> an exact
          JSON number, never routed through a double. WARNING for
          consumers: long, uint64 and decimal values can exceed 2^53,
          and JavaScript's JSON.parse silently rounds them — parse
          these fields exactly (BigInt / raw-token parsing), the way
          the hoglake webui does. Decimal renders at the COLUMN's
          scale (unscaled x 10^-scale, e.g. "1.50" for a scale-2
          column) and ALWAYS in plain notation — never
          scientific/exponent form, so a decimal(38,38) lower bound
          of unscaled 1 is the 38-fraction-digit token
          0.00000000000000000000000000000000000001, not 1E-38;
          uint64 is decimal(20,0), an integer.

        * float/double -> JSON numbers. The infinities cannot be JSON
          numbers and render as the STRING sentinels "Infinity" and
          "-Infinity". NaN never appears: it is not a bound
          (StatsSanity refuses one at every storing door; NaNs are
          counted in nan_count). Negative zero renders as -0.0 — it is
          what is stored: the normalization rule fixes -0.0 as the
          lower-bound zero and +0.0 as the upper-bound zero, so a
          lower bound of an all-zero column reads -0.0 by design.

        * temporals -> ISO-8601 strings, UTC-referenced: date
          "2026-09-05"; time "13:37:42.123456"; timestamp_s /
          timestamp_ms / timestamp "2026-09-05T12:00:00.123456" (no
          offset designator — the type is zoneless; bounds for the
          seconds/millis variants are STORED in micros, the mapped
          Iceberg type's unit, and render accordingly); timestamp_ns
          with nanosecond digits; timestamptz as an instant with a
          trailing Z. Years beyond 9999 use the expanded "+YYYYY"
          form. ISO tokens ELIDE trailing zero units — a whole-minute
          time is "00:00" and a whole-minute timestamp
          "1970-01-01T00:00", both valid ISO-8601 — so consumers must
          parse them as ISO-8601, never with fixed-precision
          patterns.

        * string/json -> the string itself; uuid -> canonical
          8-4-4-4-12; binary -> base64.

        A bound is JSON null when the column stored none (an all-null
        column has nothing to bound — a real answer, distinct from the
        file-level no-stats shape) AND when the stored bytes cannot be
        decoded under the column's visible type (a stale-width bound
        left by a pre-promote writer, an out-of-domain value): the
        "NULL, never guessed" rule's read side. Either way, a null
        bound means the caller MUST NOT prune on this column.
      properties:
        field_id: { type: integer, format: int64 }
        name:
          type: string
          description: The leaf's own name (synthetic element/key/value included).
        path:
          type: string
          description: >
            Dotted path from the top level (e.g. addr.zip, l.element,
            m.key) — nested leaves carry stats exactly like top-level
            columns.
        type:
          type: string
          description: The column's wire type name at the resolved snapshot.
        type_params:
          type: object
          additionalProperties: true
          description: The column's type_params (decimal scale/precision), when present.
        value_count:
          type: integer
          format: int64
          description: >
            Values in the file for this column, nulls INCLUDED (Iceberg
            value_counts): the column is all-null in the file exactly
            when null_count == value_count.
        null_count: { type: integer, format: int64 }
        nan_count: { type: integer, format: int64 }
        size_bytes: { type: integer, format: int64 }
        lower_bound:
          nullable: true
          description: Decoded lower bound (JSON scalar per the conventions above).
        upper_bound:
          nullable: true
          description: Decoded upper bound (JSON scalar per the conventions above).

    FileStats:
      type: object
      required: [data_file_id, stats_state, columns]
      properties:
        data_file_id: { type: integer, format: int64 }
        stats_state: { type: string, enum: [provided, pending, failed] }
        columns:
          type: array
          description: >
            One entry per stored stats row whose field id is a visible
            leaf, field-id order. Empty when the file has no stats
            rows. Columns absent from this array have no recorded
            statistics (variant columns never do; containers never
            carry rows) — absent bounds mean the caller must not prune
            on them.
          items: { $ref: "#/components/schemas/FileColumnStats" }
        no_stats_reason:
          type: string
          description: >
            Present iff stats_state is not 'provided': why the file
            has no per-column rows (deferred stats not yet hydrated,
            or hydration failed). With no bounds, callers must not
            prune this file.

    DecodeBoundRequest:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          description: >
            A wire column type name (the ColumnDef.type vocabulary,
            case-insensitive). variant and the containers have no
            single-value encoding and are named 422s.
        value:
          type: string
          description: >
            Standard base64 of the Iceberg single-value encoding.
            Validated strictly; malformed base64 is a named 422, and
            the value MUST be a JSON string — a bare JSON number is a
            named 422 rather than being coerced into digits that
            happen to decode. Capped at 1024 decoded bytes (a named
            422 past it): stored bounds can be longer — the commit
            path caps nothing — but this is a paste-one-value
            diagnostic, not a bulk door.
        type_params:
          type: object
          additionalProperties: true
          description: >
            For decimal: the scale to render at ({"scale": 2}),
            defaulting to 0 — the scale lives in the column, not the
            bytes. Ignored for every other type.

    DecodeBoundResponse:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          description: The canonical wire spelling of the requested type.
        value:
          description: >
            The decoded JSON scalar, exactly as FileColumnStats'
            lower_bound/upper_bound render it (same conventions, same
            code path).

    ChangePlan:
      type: object
      required: [table_uuid, from_snapshot, to_snapshot, files, delete_files]
      properties:
        table_uuid: { type: string, format: uuid }
        from_snapshot: { type: integer, format: int64 }
        to_snapshot: { type: integer, format: int64 }
        files:
          type: array
          items: { $ref: "#/components/schemas/DataFile" }
        delete_files:
          type: array
          description: DVs registered in (from, to] — the deletions feed.
          items: { $ref: "#/components/schemas/DeleteFile" }

    View:
      type: object
      required: [name, namespace, view_uuid, dialect, sql]
      properties:
        name: { type: string }
        namespace: { type: string }
        view_uuid: { type: string, format: uuid }
        dialect: { type: string }
        sql: { type: string }

    CatalogOptions:
      type: object
      required: [consumer_floor, earliest_snapshot_id]
      properties:
        snapshot_retention_seconds:
          type: integer
          format: int64
          nullable: true
        consumer_floor: { type: boolean }
        earliest_snapshot_id: { type: integer, format: int64 }

    ExpiryResult:
      type: object
      required: [snapshots_expired, data_files_queued, delete_files_queued,
                 new_earliest_snapshot_id]
      properties:
        snapshots_expired: { type: integer, format: int64 }
        data_files_queued: { type: integer, format: int64 }
        delete_files_queued: { type: integer, format: int64 }
        new_earliest_snapshot_id: { type: integer, format: int64 }
        floored_by_consumer:
          type: string
          description: Consumer id pinning the floor, when the sweep was capped.
        offsets_released:
          type: integer
          format: int64
          description: >
            Consumer offsets the sweep DELETED because atomic
            replacement had superseded them: rows nothing could ever
            advance, which on a `consumer_floor` catalog would pin the
            retention floor forever. Released before the floor is
            measured, and released even when retention is off, so this
            is the only work a retention-disabled sweep can report.
            Not required: a run recorded before the counter existed has
            no such field, and the ledger replays rows verbatim (the
            read path fills it with 0, which is what a run that
            predates the counter did).

    CleanupResult:
      type: object
      # objects_removed and settled_elsewhere are NOT required, for the
      # reason claimed_elsewhere is not on CompactionResult: they are
      # NON_DEFAULT on the stored model and the maintenance ledger holds
      # rows written before they existed, so `required` would be a
      # promise the ledger's own history breaks. The read path fills 0.
      required: [removed, missing, still_referenced]
      properties:
        removed:
          type: integer
          format: int64
          description: >
            Queue ROWS settled 'deleted'. Not a count of objects: two undrained
            rows over one path are legitimate state and one batched delete
            settles both. See objects_removed.
        missing:
          type: integer
          format: int64
          description: >
            Queue rows settled 'absent' — compaction staging tickets only, the
            one reason the drain still probes with HeadObject before deleting.
        still_referenced: { type: integer, format: int64 }
        objects_removed:
          type: integer
          format: int64
          description: >
            DISTINCT paths whose object was physically deleted — what
            hoglake_files_removed_total counts. Always <= removed.
        settled_elsewhere:
          type: integer
          format: int64
          description: >
            Rows dropped from a sub-batch because another writer had already
            settled them — a compaction group settling its own staging ticket
            'registered'. Normal, not a failure.
        deadline_skipped:
          type: integer
          format: int64
          description: >
            Rows a sub-batch's hold budget stopped short of: claimed by the run,
            never attempted, and drained by a later hold. Standing nonzero means
            holds are ending on their budget rather than on their work.

    RehydrateResult:
      type: object
      required: [requeued]
      properties:
        requeued:
          type: integer
          format: int64
          description: Failed files flipped back to pending.

    VerifyCheck:
      type: object
      required: [check, status, violations, samples]
      properties:
        check:
          type: string
          enum: [row_id_tiling, delete_vectors, orphans, removal_queue,
                 snapshot_density, next_row_id, expiry_floor, visibility_bounds,
                 offset_release, staging_tickets, upload_claims,
                 compaction_claims]
          description: >
            The check's stable id, and the order a report lists them
            in. An enum rather than prose so a generated client gets
            the vocabulary and so the server can be pinned against it
            (VerifySpecParityTest runs a real report and compares).
        status:
          type: string
          enum: [pass, fail]
        violations:
          type: integer
          format: int64
          description: True violation count (not capped).
        samples:
          type: array
          description: Human-readable violation details, capped at 20.
          items: { type: string }
        description:
          type: string
          description: >
            The invariant this check enforces, one paragraph, so a
            report is readable without the spec. Prose, not an
            identifier — never parse it; switch on `check`.
            OPTIONAL, and absent in exactly two places, both in the
            maintenance run ledger rather than here: this schema also
            describes a `verify` run's stored `result`, which is
            recorded WITHOUT descriptions (they are constants, and a
            ledger row would pay for them per row forever) and which for
            older rows predates the field entirely. A live response to
            this endpoint always carries it.

    VerifyReport:
      type: object
      required: [catalog, status, checks]
      properties:
        catalog: { type: string }
        status:
          type: string
          enum: [pass, fail]
          description: pass iff every check passed.
        checks:
          type: array
          items: { $ref: "#/components/schemas/VerifyCheck" }

    ExportTableManifest:
      type: object
      required: [namespace, table, table_uuid, files, delete_files]
      properties:
        namespace: { type: string }
        table: { type: string }
        table_uuid: { type: string, format: uuid }
        files:
          type: array
          description: Data files live at head_snapshot_id.
          items: { $ref: "#/components/schemas/DataFile" }
        delete_files:
          type: array
          description: Live deletion vectors at head_snapshot_id.
          items: { $ref: "#/components/schemas/DeleteFile" }

    ExportManifest:
      type: object
      description: >
        Everything read consistently at head_snapshot_id: restore the
        catalog via PITR, fetch this manifest, and every listed path
        must exist in the object store — that is the "and we can prove
        the object store matches" half of DR.
      required: [catalog, data_path, head_snapshot_id,
                 earliest_snapshot_id, tables, consumer_offsets]
      properties:
        catalog: { type: string }
        data_path: { type: string }
        head_snapshot_id:
          type: integer
          format: int64
          description: The snapshot the whole manifest was read at.
        earliest_snapshot_id: { type: integer, format: int64 }
        earliest_snapshot_time:
          type: string
          format: date-time
          nullable: true
          description: When the expiry floor was reached (null = never advanced).
        tables:
          type: array
          description: Live tables with their live files + DVs.
          items: { $ref: "#/components/schemas/ExportTableManifest" }
        consumer_offsets:
          type: array
          description: All stored offsets (replication resume points).
          items: { $ref: "#/components/schemas/ConsumerOffset" }

    CompactionResult:
      type: object
      required: [groups_compacted, files_in, files_out, bytes_in,
                 bytes_out, skipped_conflicts, dv_superseded,
                 unconvertible_schema, invalid_data, heap_budget_exceeded,
                 failed_groups]
      properties:
        groups_compacted: { type: integer, format: int64 }
        files_in: { type: integer, format: int64 }
        files_out: { type: integer, format: int64 }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        skipped_conflicts:
          type: integer
          format: int64
          description: >
            Groups aborted at commit time because an input file was no
            longer live, because the compactor's staged output claim was
            reclaimed by a concurrent cleanup drain, or because the
            commit could not get the per-catalog commit lock inside
            HOGLAKE_COMMIT_LOCK_TIMEOUT_MS (the same admission bound
            foreground commits queue under, applied to compaction's
            commit transaction and to the row locks inside its tail).
            All three are contention rather than fault: the group is
            re-planned on the next run and its staged output stays
            queued for the cleanup drain.
        dv_superseded:
          type: integer
          format: int64
          description: >
            Groups aborted at commit time because an input's deletion
            vector changed since planning (one appeared, or the planned
            one was superseded by a grown vector). The rewrite applied
            the planned vectors, so committing would resurrect rows
            deleted after the plan's read; the group re-plans instead.
        unconvertible_schema:
          type: integer
          format: int64
          description: >
            Groups skipped because a live column's type cannot be
            produced from an input file's parquet type (outside identity
            and the int->long / float->double promotions).
        invalid_data:
          type: integer
          format: int64
          description: >
            Groups skipped for a fault that is DURABLE and the writer's:
            a value that cannot exist under the type its own file
            declares (an empty byte array under a decimal, an unscaled
            value wider than the destination precision), a row large
            enough to threaten the heap, or a file whose schema
            contradicts its own registration (the reserved row-id field
            id present or absent against explicit_row_ids).

            Unlike unconvertible_schema this never clears on its own, so
            the group is re-planned and re-refused every sweep. The axis
            is durability and fault, not values-versus-schema: a nonzero
            count is a writer bug, not a backlog.
        heap_budget_exceeded:
          type: integer
          format: int64
          description: >
            Groups the SORTED rewrite path declined because
            materializing them to sort would not fit the compaction heap
            budget: a group formed on input bytes with too many rows for
            the heap. Refused in metadata at planning time from the
            registered record counts, before any object-store IO, so a
            group that cannot fit never spends ninety seconds finding
            out.

            Durable, like invalid_data, but the fault is neither the
            writer's nor the schema's: it is a table whose sort order and
            row width exceed the heap this process was given. It clears
            by raising HOGLAKE_COMPACTION_SORTED_HEAP_BYTES (with a POD
            sized for it) or by dropping the table's sort order, which
            moves it to the streaming path where group size costs no
            heap.

            TEMPORARY. The ceiling exists only because the sorted rewrite
            sorts a whole group in memory. An external merge sort removes
            it: an input that is a previous compaction output is an
            already-sorted run, so merging needs one row per input rather
            than all of them, and a client-written file (whose sort order
            is advisory and unverified) is bounded by the ingest flush
            size and can be sorted alone and spilled as a run of its own.
        failed_groups:
          type: integer
          format: int64
          description: >
            Groups that FAILED (unreadable input, S3 error, corrupt
            DV): logged, retried next run. Unlike the skip flavors this
            is not self-healing signal — a sweep whose groups all fail
            still reports groups_compacted=0 with failed_groups naming
            the problem, so a chronically broken compactor can never
            present as a green no-op.
        claimed_elsewhere:
          type: integer
          format: int64
          description: >
            Groups this sweep planned and then dropped because ANOTHER
            maintenance replica holds a live claim over one or more of
            their input files (hog_compaction_claim).

            Not a conflict, not a failure, and not work lost: the
            sibling replica is rewriting those files right now, and
            everything this sweep would have spent on them would have
            been discarded at its own commit. Read a steady nonzero
            count as the feature working — a standing ZERO on a fleet
            with two or more maintenance replicas means either
            HOGLAKE_COMPACTION_CLAIMS_ENABLED is off or the replicas
            are not in fact planning the same groups.

            It spends no object-store IO, so it does NOT consume
            HOGLAKE_COMPACTION_MAX_GROUPS_PER_RUN — the same treatment
            heap_budget_exceeded gets, and for the same reason: a skip
            that costs nothing must not be able to starve the sweep.

            OPTIONAL, and not in `required`, for the same reason
            `offsets_released` is: the maintenance run ledger holds
            rows written before this counter existed, and a rolling
            deploy has both versions replaying each other's. On a
            CURRENT server absent means zero — the stored model omits
            the field under `@JsonInclude(NON_DEFAULT)` and the
            ledger's read path fills 0 for older rows, so every
            response this server serves carries it explicitly and only
            a replayed historical row can lack it.

    RetirementResult:
      type: object
      required: [tables, rows_retired, dvs_retired, paths_queued, batches,
                 timeouts, skipped_tables, skipped_queue_full, skipped_locked,
                 convoyed, tables_remaining]
      description: >
        One retirement run's outcome for one catalog: the paced deletion
        of the file rows a dropped table left behind.


        DROP IS O(COLUMNS). Dropping a table sets
        hog_table.dropped_snapshot and end-snapshots its version and
        column rows, and touches none of its file rows — the table is
        the authority on whether its rows are reachable. This loop is
        what later deletes those rows and queues their objects, in
        batches, once the drop snapshot has sunk to or below the
        catalog's expiry floor (below the floor no retained snapshot can
        read them; above it, time travel still can).


        A catalog with no snapshot retention never retires anything,
        because its floor never advances. That is correct rather than a
        gap, and /verify's orphans check reports that population as an
        informational count instead of a violation.


        This payload appears only in the maintenance run ledger. There
        is no POST trigger for retirement: the loop
        (HOGLAKE_RETIREMENT_INTERVAL_MS, default 0 = off, turned on for
        one maintenance workload) is its only driver, because a batch
        takes the per-catalog commit lock and must not run on a replica
        serving the commit tail.
      properties:
        tables:
          type: integer
          format: int64
          description: Eligible dropped tables this run retired at least one batch of.
        rows_retired:
          type: integer
          format: int64
          description: >
            hog_data_file rows deleted. Their per-column stats and
            partition-value rows go with them through the existing FK
            cascades.
        dvs_retired:
          type: integer
          format: int64
          description: >
            hog_delete_file rows deleted, SUPERSEDED ones included. The
            batch deletes deletion vectors before their data files and
            without an end_snapshot predicate, because the data-file
            delete cascades them away otherwise — un-queued, leaving a
            puffin object nothing references and nothing reclaims.
        paths_queued:
          type: integer
          format: int64
          description: >
            Paths queued into the cleanup queue with reason
            `table_drop_gc` — rows_retired + dvs_retired, every deleted
            row queueing its path exactly once. A gap between the sum
            and this number is an object that lost its only reference.
        batches:
          type: integer
          format: int64
          description: >
            Batch transactions that committed. One batch is one hold of
            the per-catalog commit lock, HOGLAKE_RETIREMENT_BATCH rows
            wide, with HOGLAKE_RETIREMENT_PAUSE_MS between holds.
        timeouts:
          type: integer
          format: int64
          description: >
            Batches cancelled by their own transaction-local
            statement_timeout and rolled back whole, plus a run that
            gave up waiting for the commit lock. Each cancelled batch
            halves the batch size for that table for the rest of the
            run: the per-row cost is the row plus its cascade, so a wide
            table's right batch size is a property of the table. A
            standing nonzero means HOGLAKE_RETIREMENT_BATCH is too big
            for some table here.
        skipped_tables:
          type: integer
          format: int64
          description: >
            Tables whose batch selected rows and deleted none, which
            ends the run for that table. The select and the deletes name
            the same primary keys, so this cannot happen on a healthy
            catalog; the counter exists so the loop stops instead of
            spinning.
        skipped_queue_full:
          type: integer
          format: int64
          description: >
            1 when the run declined to start because the catalog's
            undrained cleanup queue already exceeded
            HOGLAKE_RETIREMENT_QUEUE_CEILING. Retirement's output is
            cleanup's input, and the drain is much the slower of the
            two.
        skipped_locked:
          type: integer
          format: int64
          description: >
            1 when another maintainer already held this catalog's
            retirement lock and this run stepped aside. Single flight
            per catalog is the design: queued maintainers tax every
            foreground commit by roughly one lock hold each and the
            work is idempotent, so waiting buys nothing.
        convoyed:
          type: integer
          format: int64
          description: >
            1 when the run gave up because the per-catalog commit lock
            was not available inside HOGLAKE_COMMIT_LOCK_TIMEOUT_MS.
            Counted apart from `timeouts` because the two ask for
            opposite remedies: a timeout means the batch is too big for
            the table, a convoy means something else is holding the
            catalog's lock. Summed together they cancel out as a signal.
        tables_remaining:
          type: integer
          format: int64
          description: >
            Eligible tables the run's wall-clock budget
            (HOGLAKE_RETIREMENT_RUN_BUDGET_MS) stopped it from reaching.
            Nonzero is the loop pacing itself, not failing: there is no
            cursor to lose, so the next run simply continues.

    MaintenanceTask:
      type: string
      enum: [hydrator, expiry, cleanup, compaction, verify, retirement]
      description: The maintenance-task vocabulary of hog_maintenance_run.

    MaintenanceRun:
      type: object
      required: [run_id, catalog, task, trigger, started_at, finished_at, status]
      properties:
        run_id: { type: integer, format: int64 }
        catalog:
          type: string
          description: The catalog the run acted on (the ledger is per-catalog).
        task: { $ref: "#/components/schemas/MaintenanceTask" }
        trigger:
          type: string
          enum: [loop, manual]
          description: >
            loop = a BackgroundLoops sweep; manual = the /maintenance/*
            trigger (for task hydrator, manual rows are rehydrate
            calls).
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        status:
          type: string
          enum: [ok, failed]
          description: >
            failed = the run itself threw (recorded with error). Per-FILE
            hydration failures are not run failures: they surface in the
            result counts and the status endpoint's failed_files backlog.
        error:
          type: string
          description: Failure detail; present iff status is failed.
        result:
          type: object
          nullable: true
          description: >
            The task's result payload — the matching POST response body:
            ExpiryResult for expiry, CleanupResult for cleanup,
            CompactionResult for compaction, VerifyReport for verify,
            RetirementResult for retirement (which has no trigger
            endpoint: the loop is its only driver).
            Hydrator loop rows carry the sweep's per-catalog counts
            (claimed, hydrated, failed, transient); manual hydrator rows
            carry RehydrateResult.

    MaintenanceRunPage:
      type: object
      required: [runs, has_more]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/MaintenanceRun" }
        has_more:
          type: boolean
          description: More runs exist below this page (page with `before`).

    LoopObservation:
      type: object
      required: [records_every_sweep]
      description: >
        What the run ledger observed about this task's background loop.
        Read from recorded runs, so it describes the whole fleet, and it
        is the only field here that can answer "is this task running".
      properties:
        observed_interval_ms:
          type: integer
          format: int64
          description: >
            The gap the loop is currently keeping, from the median of
            the recent recorded gaps. Absent when the ledger cannot say:
            fewer than two loop runs, a loop that has stopped (runs no
            longer arriving at that gap), or the hydrator, whose
            instance-wide sweep records only for the catalogs it claimed
            files for and so measures work arrival, not cadence.
        last_run_at:
          type: string
          format: date-time
          description: >
            Start of the most recent loop run. Absent when the ledger
            holds none inside its retention window.
        records_every_sweep:
          type: boolean
          description: >
            Whether every sweep of this task records a run, which is how
            a reader must interpret SILENCE here. True (expiry, cleanup,
            compaction, verify, retirement): no runs means no loop is
            running the
            task. False (hydrator): its sweep is instance-wide and
            records only for the catalogs it claimed files for, so no
            runs means no work arrived for this catalog and says nothing
            about whether the loop is alive.

    MaintenanceTaskStatus:
      type: object
      required: [task, last_run, backlog, loop]
      properties:
        task: { $ref: "#/components/schemas/MaintenanceTask" }
        loop_interval_ms:
          type: integer
          format: int64
          description: >
            The RESPONDING PROCESS's configured cadence (0 = the loop is
            off in this process; manual triggers still work — which is
            how the API workload runs verify). Absent only for a task
            with no loop at all, of which there are none today. A
            deployment may run a task's loop in a pod other than the one
            serving the API, so this must not be read as "the task is
            not running" — use `loop`.
        loop:
          oneOf:
            - { $ref: "#/components/schemas/LoopObservation" }
            - { type: object, nullable: true, enum: [null] }
          description: >
            Always included; null when the task has no loop at all — no
            task is in that position today, so null now means an older
            server that had one. A MISSING key means an older server
            that does not report the field at all, which is not the same
            claim.
        last_run:
          oneOf:
            - { $ref: "#/components/schemas/MaintenanceRun" }
            - { type: object, nullable: true, enum: [null] }
          description: Always included; null when the task has no recorded run.
        backlog:
          type: object
          description: >
            Task-specific live backlog (never a ledger lookup): hydrator
            -> pending_files, failed_files; expiry ->
            snapshot_retention_seconds (absent = expiry disabled),
            consumer_floor, earliest_snapshot_id, head_snapshot_id;
            cleanup -> queued_removals, oldest_queued_age_seconds
            (absent on an empty queue); compaction -> small_files
            (files the planner would put in a group, excluding groups
            under their scaled minimum), target_bytes; verify -> none;
            retirement -> none. Retirement carries no backlog number on
            purpose: the honest one is live file rows on dropped tables,
            which is a scan of the manifest and therefore forbidden on
            this path, and a count of dropped TABLES would answer a
            different question (one dropped 3M-row table and forty
            dropped empty ones would read identically). Its run ledger's
            rows_retired and tables_remaining are the numbers to watch.

    DatabaseHealth:
      type: object
      required: [server, activity, commit_locks, replication_slots, tables,
                 indexes, findings, blind_spots]
      properties:
        server: { $ref: "#/components/schemas/DatabaseServer" }
        activity: { $ref: "#/components/schemas/DatabaseActivity" }
        commit_locks:
          type: array
          items: { $ref: "#/components/schemas/CommitLockHolder" }
        replication_slots:
          type: array
          items: { $ref: "#/components/schemas/ReplicationSlot" }
        blind_spots:
          type: array
          items: { type: string }
          description: >
            What this page cannot see, stated so a clean report is not
            read as "the database is fine" — disk fullness is invisible
            from SQL on a managed instance, and orphaned catalog rows are
            excluded by the no-hog_*-tables rule.
        tables:
          type: array
          items: { $ref: "#/components/schemas/DatabaseTable" }
        indexes:
          type: array
          items: { $ref: "#/components/schemas/DatabaseIndex" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/DatabaseFinding" }

    DatabaseServer:
      type: object
      required: [version, database, size_bytes, connections_used, connections_max,
                 deadlocks, committed, rolled_back, xid_age, xid_freeze_max_age,
                 autovacuum_enabled]
      properties:
        version: { type: string, description: "Release only, build flags stripped." }
        database: { type: string }
        size_bytes: { type: integer, format: int64 }
        started_at: { type: string, format: date-time }
        connections_used: { type: integer }
        connections_max: { type: integer }
        cache_hit_ratio:
          type: number
          description: >
            Fraction of block reads served from cache since the last
            statistics reset. Omitted before anything has been read.
        deadlocks: { type: integer, format: int64 }
        committed: { type: integer, format: int64 }
        rolled_back: { type: integer, format: int64 }
        xid_age:
          type: integer
          format: int64
          description: age(datfrozenxid) for this database.
        xid_freeze_max_age: { type: integer, format: int64 }
        autovacuum_enabled: { type: boolean }
        temp_files:
          type: integer
          format: int64
          description: Queries that spilled to disk (work_mem pressure).
        temp_bytes: { type: integer, format: int64 }
        checkpoints_timed:
          type: integer
          format: int64
          description: >
            Scheduled checkpoints. Omitted when the statistics view is
            unreadable — the columns moved from pg_stat_bgwriter to
            pg_stat_checkpointer in PG 17, so this is version-dependent.
        checkpoints_requested:
          type: integer
          format: int64
          description: Checkpoints forced by WAL reaching max_wal_size.

    CommitLockHolder:
      type: object
      required: [catalog_id, pid, granted, waiters]
      properties:
        catalog_id:
          type: integer
          format: int64
          description: >
            The low 32 bits of the advisory key, which is the catalog id
            by construction (see Locks.kt).
        catalog:
          type: string
          description: Null if the catalog row is gone.
        pid: { type: integer }
        granted:
          type: boolean
          description: False for a session queued behind the lock.
        held_seconds:
          type: number
          description: Age of the holder's transaction.
        waiters:
          type: integer
          description: Sessions queued behind this lock.

    ReplicationSlot:
      type: object
      required: [name, slot_type, active]
      properties:
        name: { type: string }
        slot_type: { type: string }
        active: { type: boolean }
        retained_wal_bytes:
          type: integer
          format: int64
          description: >
            WAL pinned by this slot. An inactive slot retains it until
            the volume fills, which is invisible from SQL on a managed
            instance.

    DatabaseActivity:
      type: object
      required: [active, idle, idle_in_transaction, waiting]
      properties:
        active: { type: integer }
        idle: { type: integer }
        idle_in_transaction: { type: integer }
        waiting:
          type: integer
          description: Sessions blocked on a lock.
        longest_transaction_seconds: { type: number }
        longest_idle_in_transaction_seconds:
          type: number
          description: >
            Age of the oldest open-but-idle transaction. This pins the
            vacuum horizon for the whole database.
        longest_wait_seconds: { type: number }

    DatabaseTable:
      type: object
      required: [name, live_tuples, dead_tuples, table_bytes, index_bytes,
                 toast_bytes, total_bytes, seq_scans, index_scans, autovacuum_count]
      properties:
        name: { type: string }
        live_tuples: { type: integer, format: int64 }
        dead_tuples: { type: integer, format: int64 }
        dead_ratio:
          type: number
          description: Omitted for an empty table rather than reported as zero.
        table_bytes: { type: integer, format: int64 }
        index_bytes: { type: integer, format: int64 }
        toast_bytes: { type: integer, format: int64 }
        total_bytes: { type: integer, format: int64 }
        seq_scans: { type: integer, format: int64 }
        index_scans: { type: integer, format: int64 }
        last_vacuum: { type: string, format: date-time }
        last_autovacuum: { type: string, format: date-time }
        last_analyze: { type: string, format: date-time }
        last_autoanalyze: { type: string, format: date-time }
        autovacuum_count: { type: integer, format: int64 }

    DatabaseIndex:
      type: object
      required: [table, name, size_bytes, scans, constraint_backing]
      properties:
        table: { type: string }
        name: { type: string }
        size_bytes: { type: integer, format: int64 }
        scans:
          type: integer
          format: int64
          description: Cumulative since the last statistics reset.
        constraint_backing:
          type: boolean
          description: >
            Backs a unique or primary-key constraint, so it is doing a
            job whether or not it is ever scanned and must not be
            reported as droppable.

    DatabaseFinding:
      type: object
      required: [severity, code, title, detail, hoglake_impact]
      properties:
        severity: { type: string, enum: [info, warn, critical] }
        code: { type: string }
        title: { type: string }
        detail: { type: string, description: What was measured. }
        hoglake_impact:
          type: string
          description: What it means for this schema and its commit path.

    MaintenanceStatus:
      type: object
      required: [catalog, tasks]
      properties:
        catalog: { type: string }
        sampled_at:
          type: string
          format: date-time
          description: Completion time of the published backlog sample. Absent during warmup.
        sample_started_at:
          type: string
          format: date-time
          description: Beginning of the observation window.
        sampled_snapshot_id:
          type: integer
          format: int64
          description: Catalog snapshot used for sampled file visibility.
        tasks:
          type: array
          description: All five maintenance tasks, always present.
          items: { $ref: "#/components/schemas/MaintenanceTaskStatus" }

    InstanceMaintenanceStatus:
      type: object
      required: [catalogs, has_more]
      properties:
        has_more: { type: boolean }
        next_after:
          type: string
          description: Exclusive catalog-name cursor for the next page, present when has_more.
        catalogs:
          type: array
          description: This page's MaintenanceStatus entries, ordered by catalog name.
          items: { $ref: "#/components/schemas/MaintenanceStatus" }

    PartitionValue:
      type: object
      required: [field, value]
      properties:
        field:
          type: string
          description: >
            Partition field display name: the source column's name for
            identity transforms, "<column>_<transform>" otherwise
            (e.g. ts_month).
        value:
          type: string
          nullable: true
          description: >
            Transformed partition value; explicit null for a null
            partition value.

    PartitionDebt:
      type: object
      required: [namespace, table, table_uuid, partition_values,
                 file_count, small_file_count, total_bytes,
                 small_file_bytes, avg_file_bytes, dv_count, debt_score]
      properties:
        namespace: { type: string }
        table: { type: string }
        table_uuid: { type: string, format: uuid }
        partition_values:
          type: array
          description: Empty for an unpartitioned vintage.
          items: { $ref: "#/components/schemas/PartitionValue" }
        spec_id:
          type: integer
          format: int64
          description: >
            Spec the group's files were written under (not necessarily
            the table's current one). Omitted for an unpartitioned
            vintage.
        file_count: { type: integer, format: int64 }
        small_file_count:
          type: integer
          format: int64
          description: Files under the compaction target size (strict <).
        total_bytes: { type: integer, format: int64 }
        small_file_bytes: { type: integer, format: int64 }
        avg_file_bytes:
          type: integer
          format: int64
          description: total_bytes / file_count, floored.
        dv_count:
          type: integer
          format: int64
          description: Live deletion vectors over the partition's files.
        debt_score:
          type: integer
          format: int64
          description: >
            Files the one-pass planner would put in a group — sorted by
            size and packed to the compaction target or to
            HOGLAKE_COMPACTION_MAX_INPUT_FILES, trailing remainder
            included — before applying the per-run budget. A group under
            its scaled minimum (see the compaction endpoint) is excluded.
            Uses the same bounds and target as compaction. The ranking
            key (desc, ties by small_file_bytes desc).

    PartitionStatsReport:
      type: object
      required: [partitions, truncated, stale_spec_groups, small_file_threshold_bytes]
      properties:
        sampled_at:
          type: string
          format: date-time
          description: Last completed summary sample. Absent during warmup (partitions is then empty).
        partitions:
          type: array
          items: { $ref: "#/components/schemas/PartitionDebt" }
        truncated:
          type: boolean
          description: More groups existed than the requested limit.
        small_file_threshold_bytes:
          type: integer
          format: int64
          description: >
            The small-file threshold this report was computed with (the
            compaction target size, HOGLAKE_COMPACTION_TARGET_BYTES;
            strict less-than) — so displays can say what "small" means
            in bytes.
        stale_spec_groups:
          type: integer
          format: int64
          description: >
            Groups (across the whole result set, not just this page)
            whose spec vintage is not the table's current live spec —
            partitions a spec change left behind.

    Snapshot:
      type: object
      required: [snapshot_id, snapshot_time, schema_version]
      properties:
        snapshot_id: { type: integer, format: int64 }
        snapshot_time: { type: string, format: date-time }
        schema_version: { type: integer, format: int64 }
        author: { type: string }
        message: { type: string }
        changes:
          type: array
          description: >
            Typed change rows. kind is the closed conflict vocabulary:
            namespace_created/dropped, table_created/dropped/altered,
            table_inserted_into, table_deleted_from, table_compacted
            (a maintenance rewrite — object_id is the table; never a
            conflict for any writer, guarded or not, since it changes
            which files back a table and not which rows are visible in
            it, and its files never enter the changefeed),
            view_created/dropped.
          items:
            type: object
            required: [kind, object_id]
            properties:
              kind: { type: string }
              object_id:
                type: integer
                format: int64
                description: >
                  The changed object (table_id, namespace_id, or
                  view_id). Every change kind names an object — never
                  null.

    SnapshotPage:
      type: object
      required: [snapshots, has_more]
      properties:
        snapshots:
          type: array
          items: { $ref: "#/components/schemas/Snapshot" }
        has_more: { type: boolean }

    KafkaSink:
      type: object
      required: [type, bootstrap_servers, topic]
      properties:
        type: { type: string, enum: [kafka] }
        bootstrap_servers: { type: string }
        topic: { type: string }
        format:
          type: string
          enum: [arrow_ipc, json]
          default: arrow_ipc
          description: >
            arrow_ipc: one record per Arrow IPC batch (efficient, typed).
            json: one record per row (envelope
            {op, snapshot_id, row_id, columns...}; deletes carry op +
            row_id only).

    CreatePublicationRequest:
      type: object
      required: [name, namespace, table, sink]
      properties:
        name: { type: string }
        namespace: { type: string }
        table: { type: string }
        sink: { $ref: "#/components/schemas/KafkaSink" }
        from_snapshot:
          type: integer
          format: int64
          description: Start point; defaults to head at creation time.

    Publication:
      type: object
      required: [name, table_uuid, sink, state, committed_snapshot]
      properties:
        name: { type: string }
        table_uuid: { type: string, format: uuid }
        sink: { $ref: "#/components/schemas/KafkaSink" }
        state:
          type: string
          enum: [pending, active, halted]
        committed_snapshot: { type: integer, format: int64 }
        lag_snapshots: { type: integer, format: int64 }
        last_error: { type: string }

    ConsumerOffset:
      type: object
      required: [consumer_id, table_uuid, committed_snapshot, updated_at]
      properties:
        consumer_id: { type: string }
        table_uuid: { type: string, format: uuid }
        committed_snapshot: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }

    ConsumerTableOffset:
      type: object
      required: [table_uuid, committed_snapshot, updated_at, table_dropped]
      properties:
        table_uuid: { type: string, format: uuid }
        committed_snapshot: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
        namespace:
          type: string
          description: Omitted only for a uuid no table incarnation ever carried.
        table_name:
          type: string
          description: Live name, or the last name before the drop.
        table_dropped: { type: boolean }

    ConsumerSummary:
      type: object
      required: [consumer_id, offsets]
      properties:
        consumer_id: { type: string }
        offsets:
          type: array
          items: { $ref: "#/components/schemas/ConsumerTableOffset" }

    ConsumerList:
      type: object
      required: [consumers]
      properties:
        consumers:
          type: array
          items: { $ref: "#/components/schemas/ConsumerSummary" }
