[project]
name = "pyhoglake"
version = "1.3.10"
description = "Python client for hoglake, the Postgres-native lakehouse-catalog control plane"
readme = "README.md"
license = "MIT"
authors = [{ name = "PostHog" }]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    # 21.0, not 18.0: pa.uuid() exists from 18, but pyarrow only stamps
    # the parquet UUID logical annotation hoglake's uuid wire form
    # requires from 21 (measured against 18.0/18.1/19.0/20.0, all of
    # which write a bare FIXED_LEN_BYTE_ARRAY(16)). Current release at
    # the time of the bump: 25.0.1.
    "pyarrow>=21.0",
    "thrift>=0.22.0,<1",
]

[project.optional-dependencies]
# The single-request upload path. pyarrow's S3 output stream always opens
# a multipart upload — 3 requests for a 12 KiB parquet file — and Arrow
# exposes no whole-buffer PutObject, so the fast path for small objects
# needs an S3 client of its own. Optional so a plain `pip install
# pyhoglake` stays the three-dependency install it is today (httpx,
# pyarrow, thrift): without it, small objects take the same streaming
# path they always did.
#
# The floor is the FRAMING boundary, not a guess. botocore 1.36.0
# (2025-01-15) is the release whose changelog reads "S3 client behavior
# is updated to always calculate a CRC32 checksum by default for
# operations that support it" and "Botocore will no longer automatically
# compute and populate the Content-MD5 header" — so PutObject bodies
# below that version are framed differently from every request this path
# was verified with (botocore 1.43.105: CRC32 trailer, exact
# Content-Length, no aws-chunked). That change has broken S3-compatible
# endpoints before, so an install must not silently get the other
# framing. boto3 1.36.0 (PyPI, 2025-01-15) is the matching release: it
# requires botocore >=1.36.0,<1.37.0.
fast-upload = ["boto3>=1.36.0"]

[project.urls]
Repository = "https://github.com/PostHog/hoglake"
Documentation = "https://github.com/PostHog/hoglake/tree/main/pyhoglake"
Issues = "https://github.com/PostHog/hoglake/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "hypothesis>=6.100",
    # Pinned: an unpinned ruff resolves a different rule set per machine
    # (and silently ignored the per-file-ignores below).
    "ruff==0.16.7",
    "mypy==2.3.1",
    # Not optional for the suite: the single-request upload path is only
    # covered if boto3 is importable here. Same floor as the extra, so
    # the suite cannot pass against framing the extra would not install.
    "boto3>=1.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyhoglake"]

[tool.hatch.build.targets.sdist]
# Keeps the flox env, justfile, and uv.lock out of the sdist. Hatchling
# adds pyproject.toml, README.md, and LICENSE on its own.
only-include = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Default rule selection applies; src/ stays strict.
"tests/**" = [
    "PLC3002", # table-driven lambda-call test style is deliberate
    "DTZ001",  # tests exercise naive datetimes on purpose
    "BLE001",  # conftest server-probe catch is deliberate
]

[tool.mypy]
files = ["src"]
python_version = "3.11"

[[tool.mypy.overrides]]
# pyarrow ships no type information.
module = ["pyarrow", "pyarrow.*", "thrift", "thrift.*", "boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a live hoglake server (HOGLAKE_URL)",
]
testpaths = ["tests"]
# qe_*.py: QE/property-based fuzzing suites live alongside test_*.py
python_files = ["test_*.py", "qe_*.py"]
