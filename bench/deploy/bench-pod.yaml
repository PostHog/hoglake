# A shell with the synthetic-data tools, next to a gigahog server.
#
# The image already contains bench and its dependencies (bench/Dockerfile,
# published by .github/workflows/bench-image.yml), so there is nothing to
# copy in and nothing to install: apply, exec, run. Nothing deploys this
# image — you pull it by hand, here.
#
# It runs as the gigahog-server ServiceAccount because that is one of the two
# identities the IRSA role trusts — which is how the pod reaches S3 without
# any key material. Bench is a WRITER in hoglake's footer-shipping model: it
# uploads the parquet itself and the server only registers the paths, so the
# pod needs the bucket, not just the API.
#
# Nothing runs on its own. The container sleeps; you drive it by hand (see
# bench/README.md, "Running in-cluster").
#
#   kubectl apply -f bench/deploy/bench-pod.yaml
#   kubectl -n gigahog exec -it bench-shell -- hoglake-bench seed --gb 0.5 --bucket <bucket>
#
# Delete it when you are done: it is a pod, not a Deployment, so nothing
# brings it back.
apiVersion: v1
kind: Pod
metadata:
  name: bench-shell
  namespace: gigahog
  labels:
    app: bench-shell
spec:
  serviceAccountName: gigahog-server
  # A bench run is a burst of parquet writes; do not let it be the reason a
  # node evicts the server it is writing to.
  priorityClassName: null
  restartPolicy: Never
  # The image runs as uid 10001. fsGroup is the load-bearing line: without
  # it the emptyDirs below are root-owned and a non-root container cannot
  # write its results journal or spill to /tmp.
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containers:
    - name: shell
      # Pin for a run that has to be reproducible: swap `latest` for a
      # commit sha tag, or for `@sha256:<multi-arch manifest digest>` as
      # printed by the publish job's summary. `latest` plus Always is the
      # default so a re-apply after a merge actually gets the new harness.
      image: ghcr.io/posthog/hoglake-bench:latest
      imagePullPolicy: Always
      # The image's entrypoint is the CLI. Override it: the pod is a place
      # to run from, not a job — nothing starts until you exec in.
      command: ["sleep", "infinity"]
      workingDir: /work
      env:
        # In-cluster service DNS: same namespace, so the short name resolves.
        - name: HOGLAKE_URL
          value: http://gigahog-server:8080
        # Empty on purpose. Empty endpoint means real AWS rather than the
        # local MinIO default; empty keys mean the SDK's credential chain,
        # which IRSA populates from the projected web-identity token.
        - name: HOGLAKE_S3_ENDPOINT
          value: ""
        - name: HOGLAKE_S3_ACCESS_KEY
          value: ""
        - name: HOGLAKE_S3_SECRET_KEY
          value: ""
        - name: HOGLAKE_S3_REGION
          value: us-east-1
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          # Generating wide nested rows is memory-hungry; the generator holds
          # a batch in Arrow before writing it.
          memory: 8Gi
      volumeMounts:
        - name: work
          mountPath: /work
        - name: tmp
          mountPath: /tmp
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: work
      emptyDir: {}
    - name: tmp
      emptyDir: {}
